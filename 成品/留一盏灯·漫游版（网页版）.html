  /* ------------------------------------------------------------------ *
   * 新增成就（挂进剧情成就表，封面与成就面板自动并入）
   * 注意：委托分成互斥组之后，「全部完成」不再可能，
   * 所以门槛改成做满多少条、掌握多少次。
   * ------------------------------------------------------------------ */
  const GAME_ACHIEVEMENTS = [
    { id: 'explorer',   name: '把校园走遍', desc: '十四个地方都去过', icon: '⌖' },
    { id: 'greeter',    name: '都打过招呼', desc: '和六位都聊过天', icon: '☰' },
    { id: 'helper',     name: '帮上忙了',   desc: '完成第一个委托', icon: '✓' },
    { id: 'courier',    name: '两手之间',   desc: '亲手把一件东西从一个人手里交到另一个人手里', icon: '➜' },
    { id: 'curator',    name: '角落里的小东西', desc: '找齐校园里的十四件小物', icon: '❦' },
    { id: 'confidant',  name: '熟到不能再熟', desc: '有一个人和你到了最后', icon: '♥' },
    { id: 'allconfidant', name: '六个都到了', desc: '和六个人都熟到底', icon: '☘' },
    { id: 'workhorse',  name: '这一学期的事', desc: '完成十五条委托', icon: '✦' },
    { id: 'packrat',    name: '口袋更深了', desc: '集齐二十张手记', icon: '▤' },
  ];

  /* ------------------------------------------------------------------ *
   * 世界状态（挂在 Engine.state.world）
   * ------------------------------------------------------------------ */
  const RAPPORT_MAX = 5;
  const HELP_FULL = 15;    // 「这一学期的事」
  const NOTE_FULL = 20;    // 「口袋更深了」

  function freshWorld() {
    return {
      loc: 'campus',
      unlocked: WINDOWS.w1.unlocks.slice(),
      visited: ['campus'],
      talked: {},      // npc -> 最近打过招呼的窗口
      rapport: {},     // npc -> 0..5
      quests: {},      // qid -> { stage, done? }
      notes: [],       // 手记 qid 列表
      observed: {},    // loc:wid -> 已看过
      items: [],       // 口袋：item id 列表（任务道具 / 小物 / 留念物）
      keepsakes: [],   // 已经拿到留念物的 npc
      flags: {},       // 委托写下的分路 flag
      windowSeen: 0,
    };
  }

  function ensure() {
    const st = SP.engine.state;
    if (!st) return null;
    let w = st.world;
    if (!w || !w.unlocked) { st.world = freshWorld(); return st.world; }
    // 老存档兼容：补齐新字段，剔掉已经不在表里的条目
    if (!Array.isArray(w.items)) w.items = [];
    if (!Array.isArray(w.keepsakes)) w.keepsakes = [];
    if (!w.flags || typeof w.flags !== 'object') w.flags = {};
    if (!w.quests || typeof w.quests !== 'object') w.quests = {};
    for (const qid in w.quests) if (!QUESTS[qid]) delete w.quests[qid];
    w.notes = (w.notes || []).filter((qid) => NOTES[qid]);
    return w;
  }

  function give(id) {
    if (SP.storage.unlockAchievement(id)) {
      SP.ui.achievementPopup(id);
      SP.audio.sfx('unlock');
    }
  }

  /* ------------------------------ 口袋 ------------------------------ */

  const asList = (v) => (v == null ? [] : Array.isArray(v) ? v : [v]);
  const itemDef = (id) => ITEMS[id] || null;
  const ownedItems = () => (ensure() || {}).items || [];
  const hasItem = (id) => ownedItems().includes(id);
  const itemsOfKind = (kind) => ownedItems().filter((id) => (ITEMS[id] || {}).kind === kind);
  /** 一件东西有没有被人来回递过（用于成就与「两手之间」） */
  function deliveredCount() {
    const w = ensure();
    if (!w) return 0;
    let n = 0;
    for (const qid in w.quests) {
      const q = w.quests[qid];
      if (!q.done) continue;
      (QUESTS[qid].steps || []).forEach((s) => { if (asList(s.give).length) n++; });
    }
    return n;
  }

  function checkAchievements(w) {
    if (Object.keys(LOCS).every((l) => w.visited.includes(l))) give('explorer');
    if (Object.keys(NPCS).every((n) => w.talked[n])) give('greeter');
    const done = Object.keys(w.quests).filter((q) => w.quests[q].done);
    if (done.length >= 1) give('helper');
    if (done.length >= HELP_FULL) give('workhorse');
    if (w.notes.length >= NOTE_FULL) give('packrat');
    if (deliveredCount() > 0) give('courier');
    const eggs = (w.items || []).filter((id) => (ITEMS[id] || {}).kind === 'egg');
    if (eggs.length >= Object.keys(LOCS).length) give('curator');
    const full = Object.keys(NPCS).filter((n) => (w.rapport[n] || 0) >= RAPPORT_MAX);
    if (full.length >= 1) give('confidant');
    if (full.length >= Object.keys(NPCS).length) give('allconfidant');
  }

  function addRapport(npc, delta) {
    const w = ensure();
    if (!w) return 0;
    const before = w.rapport[npc] || 0;
    w.rapport[npc] = clamp(before + delta, 0, RAPPORT_MAX);
    return w.rapport[npc] - before;
  }

  /* ------------------------------ 查询 ------------------------------ */

  function windowOf(gateId) { return GATE_TO_WINDOW[gateId] || null; }

  function npcAt(npcId, wid) {
    const n = NPCS[npcId];
    return (n && n.windows[wid]) || null;
  }

  function npcsHere(loc, wid) {
    return Object.keys(NPCS).filter((id) => {
      const spot = npcAt(id, wid);
      return spot && spot.loc === loc;
    });
  }

  /** 常驻寒暄：按好感度取档（0 还客气，3 已经熟了） */
  function npcAgain(npcId, wid) {
    const w = ensure();
    const spot = npcAt(npcId, wid);
    if (!spot || !spot.again) return [];
    const r = (w && w.rapport[npcId]) || 0;
    const tiers = Object.keys(spot.again).map(Number).sort((a, b) => a - b);
    let pick = null;
    for (const t of tiers) if (r >= t) pick = t;
    if (pick === null) pick = tiers[0];
    return spot.again[pick] || [];
  }

  /** 前置条件是否满足（requires.quest / requires.items） */
  function reqMet(qid) {
    const w = ensure();
    const r = QUESTS[qid].requires;
    if (!r) return true;
    if (r.quest) {
      const q = w.quests[r.quest];
      if (!q || !q.done) return false;
    }
    for (const it of asList(r.items)) if (!w.items.includes(it)) return false;
    return true;
  }

  /** 组内已经接下（或完成）的那一件 */
  function groupTaken(groupId) {
    const w = ensure();
    if (!w || !groupId) return null;
    for (const qid in QUESTS) {
      if (QUESTS[qid].group === groupId && w.quests[qid]) return qid;
    }
    return null;
  }

  /**
   * 一条委托此刻的状态：
   *   done       已完成
   *   ready      目标都做完了，可以回去交差
   *   active     进行中
   *   abandoned  同一组里你已经选了别的，这件这个月做不成了
   *   locked     前置条件没满足
   *   offer      可以接
   */
  function questState(qid) {
    const w = ensure();
    if (!w || !QUESTS[qid]) return 'locked';
    const q = w.quests[qid];
    if (q) {
      if (q.done) return 'done';
      return q.stage >= QUESTS[qid].steps.length ? 'ready' : 'active';
    }
    const g = QUESTS[qid].group;
    if (g && groupTaken(g)) return 'abandoned';
    if (!reqMet(qid)) return 'locked';
    return 'offer';
  }

  /** 被互斥挤掉的那些委托（日志里要写明“这个月没空”） */
  function abandonedQuests(wid) {
    return Object.keys(QUESTS).filter((qid) =>
      QUESTS[qid].window === wid && questState(qid) === 'abandoned');
  }

  /** npc 在当前窗口是否有“与你有关的事”（地图/场景标记用） */
  function npcHasBusiness(npcId, wid) {
    const w = ensure();
    if (!w) return false;
    if (keepsakeFor(npcId)) return true;                  // 熟到底了，有东西要给你
    for (const qid in w.quests) {
      const q = w.quests[qid];
      if (q.done) continue;
      if (QUESTS[qid].giver === npcId && q.stage >= QUESTS[qid].steps.length) return true;
      const step = QUESTS[qid].steps[q.stage];
      if (step && step.type === 'talk' && step.npc === npcId) return true;
    }
    for (const qid in QUESTS) {
      if (QUESTS[qid].window !== wid || QUESTS[qid].giver !== npcId) continue;
      if (questState(qid) === 'offer') return true;
    }
    return false;
  }

  function questsOfferable(npcId, wid) {
    const w = ensure();
    // 同一个人手上还压着没办完的事，就不会再开口拜托下一件
    const busy = Object.keys(w.quests).some((qid) =>
      QUESTS[qid].giver === npcId && !w.quests[qid].done);
    if (busy) return [];
    return Object.keys(QUESTS).filter((qid) =>
      QUESTS[qid].window === wid && QUESTS[qid].giver === npcId && questState(qid) === 'offer');
  }

  function questReadyToTurnIn(qid) {
    const w = ensure();
    const q = w && w.quests && w.quests[qid];
    return !!q && !q.done && q.stage >= QUESTS[qid].steps.length;
  }

  function readyQuestsFor(npcId) {
    const w = ensure();
    if (!w || !w.quests) return [];
    return Object.keys(w.quests).filter((qid) => QUESTS[qid].giver === npcId && questReadyToTurnIn(qid));
  }

  function stepQuestsFor(npcId) {
    const w = ensure();
    if (!w || !w.quests) return [];
    return Object.keys(w.quests).filter((qid) => {
      const q = w.quests[qid];
      if (q.done) return false;
      const step = QUESTS[qid].steps[q.stage];
      return !!step && step.type === 'talk' && step.npc === npcId;
    });
  }

  /** 当前这一步的说明文字（对话里当提示用） */
  function currentStep(qid) {
    const w = ensure();
    const q = w && w.quests && w.quests[qid];
    if (!q) return null;
    return QUESTS[qid].steps[q.stage] || null;
  }

  /** 某条委托、某一步的对白（reach / observe 那几步是空数组） */
  function stepLines(qid, i) {
    const L = QUEST_LINES[qid];
    if (!L || !L.steps) return [];
    return L.steps[i] || [];
  }

  /* ------------------------------ 事件 ------------------------------ */

  function onTalk(npcId, wid) {
    const w = ensure();
    const first = w.talked[npcId] !== wid;
    if (first) {
      w.talked[npcId] = wid;
      addRapport(npcId, 1);
    }
    checkAchievements(w);
    return first;
  }

  /** 接下委托：同组的其余几件就此作罢 */
  function accept(qid) {
    const w = ensure();
    if (!w || w.quests[qid] || questState(qid) !== 'offer') return null;
    w.quests[qid] = { stage: 0 };
    const q = QUESTS[qid];
    if (q.unlockOnAccept && !w.unlocked.includes(q.unlockOnAccept)) w.unlocked.push(q.unlockOnAccept);
    const abandoned = [];
    if (q.group) {
      for (const o in QUESTS) {
        if (o !== qid && QUESTS[o].group === q.group && !w.quests[o]) abandoned.push(o);
      }
    }
    // 主线已经没有「当场做选择」这回事了，第一个选择发生在接委托的时候
    give('firstChoice');
    checkAchievements(w);
    return { qid, group: q.group || null, abandoned };
  }

  /**
   * 完成一步：结算道具（先交出、再收下），然后推进 stage。
   * 「拿到 → 收进口袋 → 交付时给出去」全在这一个函数里。
   */
  function settleStep(qid) {
    const w = ensure();
    const q = w && w.quests && w.quests[qid];
    if (!q || q.done) return null;
    const step = QUESTS[qid].steps[q.stage];
    if (!step) return null;
    const gave = [], took = [];
    for (const id of asList(step.give)) {
      const i = w.items.indexOf(id);
      if (i >= 0) { w.items.splice(i, 1); gave.push(id); }
    }
    for (const id of asList(step.take)) {
      if (id && ITEMS[id] && !w.items.includes(id)) { w.items.push(id); took.push(id); }
    }
    q.stage++;
    checkAchievements(w);
    return { qid, took, gave, stage: q.stage };
  }

  /** 与某人/某地对话推进的 talk 步 */
  function advance(qid) { return settleStep(qid); }

  function complete(qid) {
    const w = ensure();
    const q = w && w.quests && w.quests[qid];
    if (!q || q.done || q.stage < QUESTS[qid].steps.length) return null;
    q.done = true;
    const flags = QUESTS[qid].setFlags || {};
    Object.assign(w.flags, flags);
    for (const id of asList(QUESTS[qid].reward)) {
      if (id && ITEMS[id] && !w.items.includes(id)) w.items.push(id);
    }
    addRapport(QUESTS[qid].giver, 2);
    // 一件事跑完，经手过的人也记你一份好：牵头人 +2，经手人各 +1
    const seen = new Set([QUESTS[qid].giver]);
    for (const s of QUESTS[qid].steps || []) {
      if (s.npc && !seen.has(s.npc)) { seen.add(s.npc); addRapport(s.npc, 1); }
    }
    if (!w.notes.includes(qid)) w.notes.push(qid);
    checkAchievements(w);
    return { note: NOTES[qid], rapport: QUESTS[qid].giver, flags, group: QUESTS[qid].group || null };
  }

  /** 到达某地：reach 类目标推进；返回被推进的委托（含道具结算） */
  function onReach(loc) {
    const w = ensure();
    if (!w || !LOCS[loc]) return [];
    w.loc = loc;
    if (!w.visited.includes(loc)) w.visited.push(loc);
    const hit = [];
    for (const qid in w.quests) {
      const q = w.quests[qid];
      if (q.done) continue;
      const step = QUESTS[qid].steps[q.stage];
      if (step && step.type === 'reach' && step.at === loc) {
        const r = settleStep(qid);
        if (r) hit.push(r);
      }
    }
    checkAchievements(w);
    return hit;
  }

  /** 看一看：返回文案 + 推进 observe 类目标 + 顺手发现的小东西 */
  function onObserve(loc, wid) {
    const w = ensure();
    const L = LOCS[loc] || {};
    const text = (L.look && (L.look[wid] || L.look.default)) || '';
    const hit = [];
    for (const qid in w.quests) {
      const q = w.quests[qid];
      if (q.done) continue;
      const step = QUESTS[qid].steps[q.stage];
      if (step && step.type === 'observe' && step.at === loc) {
        const r = settleStep(qid);
        if (r) hit.push(r);
      }
    }
    let egg = null;
    if (L.egg && ITEMS[L.egg] && !w.items.includes(L.egg)) {
      w.items.push(L.egg);
      egg = L.egg;
    }
    w.observed[loc + ':' + wid] = true;
    checkAchievements(w);
    return { text, hit, egg, seen: true };
  }

  /** 解锁窗口地点（累计） */
  function unlockWindow(wid) {
    const w = ensure();
    const idx = Number(wid.slice(1));
    if (idx > w.windowSeen) w.windowSeen = idx;
    for (const l of WINDOWS[wid].unlocks) {
      if (!w.unlocked.includes(l)) w.unlocked.push(l);
    }
    return w;
  }

  /* --------------------------- 留念物 --------------------------- */

  /** 熟到底了、而且还没给过 → 返回这段专属对话 */
  function keepsakeFor(npcId) {
    const w = ensure();
    const K = KEEPSAKES[npcId];
    if (!w || !K) return null;
    if (w.keepsakes.includes(npcId)) return null;
    if ((w.rapport[npcId] || 0) < RAPPORT_MAX) return null;
    return { npc: npcId, item: K.item, lines: K.lines };
  }

  function takeKeepsake(npcId) {
    const w = ensure();
    const K = KEEPSAKES[npcId];
    if (!w || !K || w.keepsakes.includes(npcId)) return null;
    w.keepsakes.push(npcId);
    if (!w.items.includes(K.item)) w.items.push(K.item);
    checkAchievements(w);
    return { item: K.item, def: ITEMS[K.item] };
  }

  /**
   * 主线分岔用得到的 flag 取样。
   * 节点的 next 是函数，静态查不出它会通向哪儿；于是按「委托真能写出
   * 哪些取值」造一份样本，让分支图与校验器都能把每条 next 走一遍。
   */
  function flagSamples() {
    const dom = {};
    for (const qid in QUESTS) {
      const f = QUESTS[qid].setFlags;
      if (!f) continue;
      for (const k in f) (dom[k] || (dom[k] = [])).push(f[k]);
    }
    let out = [{}];
    for (const k in dom) {
      const vals = [...new Set(dom[k])];
      const next = [];
      for (const base of out) for (const v of vals) next.push(Object.assign({}, base, { [k]: v }));
      out = next;
      if (out.length > 4096) { out = out.slice(0, 4096); break; }
    }
    return out;
  }

  /* ------------------------- 主线分路的 flag ------------------------- */

  /**
   * 世界推导出来的 flags：每条做完的委托都会写下自己的几笔。
   * 引擎在每个节点渲染前把它并进 state.flags，
   * 主线于是能读到「这个月你把时间花在了谁身上」。
   */
  function derivedFlags() {
    const w = ensure();
    if (!w) return {};
    const out = {};
    for (const qid in w.quests) {
      if (!w.quests[qid].done) continue;
      const f = QUESTS[qid].setFlags;
      if (f) for (const k in f) out[k] = f[k];
    }
    for (const k in (w.flags || {})) out[k] = w.flags[k];
    return out;
  }

  /* --------------------------- 口袋的面板数据 --------------------------- */

  /** 手记 → 口袋面板的追加页 */
  function notebookExtras() {
    const w = ensure();
    if (!w || !w.notes.length) return [];
    return w.notes.map((qid) => NOTES[qid]).filter(Boolean);
  }

  /** 口袋分栏：任务道具 / 校园小物 / 留念物 */
  function pocketSections() {
    const w = ensure();
    if (!w) return [];
    const mk = (kind) => w.items
      .filter((id) => (ITEMS[id] || {}).kind === kind)
      .map((id) => Object.assign({ id }, ITEMS[id]));
    const quest = mk('quest');
    const egg = mk('egg');
    const keepsake = mk('keepsake');
    return [
      { key: 'quest', title: '手上的事', sub: '别人交给你、还要交出去的东西', items: quest },
      { key: 'keepsake', title: '留念', sub: '熟到不能再熟以后，他/她给你的', items: keepsake },
      { key: 'egg', title: '角落里的小东西', sub: '在校园里顺手捡的，没什么用', items: egg },
    ].filter((s) => s.items.length);
  }

  /** 故事推进时同步当前位置（非漫游期也能在地图上看到“你在这里”） */
  function track(sceneKey) {
    const w = ensure();
    if (!w || !LOCS[sceneKey]) return;
    w.loc = sceneKey;
    if (!w.visited.includes(sceneKey)) w.visited.push(sceneKey);
  }

  /* 成就注册进剧情表（一次性） */
  (function register() {
    const ST = SP.story;
    if (!ST || !ST.ACHIEVEMENTS) return;
    for (const a of GAME_ACHIEVEMENTS) {
      if (!ST.ACHIEVEMENTS.some((x) => x.id === a.id)) ST.ACHIEVEMENTS.push(a);
    }
  })();

  SP.game = {
    LOCS, LOC_ROADS, WINDOWS, GATE_TO_WINDOW, NPCS,
    ITEMS, GROUPS, QUESTS, QUEST_LINES, NOTES, KEEPSAKES,
    GAME_ACHIEVEMENTS, RAPPORT_MAX, HELP_FULL, NOTE_FULL,
    freshWorld, ensure, windowOf, npcAt, npcsHere, npcAgain, npcHasBusiness,
    questState, questsOfferable, readyQuestsFor, stepQuestsFor, questReadyToTurnIn,
    abandonedQuests, currentStep, stepLines, reqMet, groupTaken,
    onTalk, accept, advance, complete, onReach, onObserve, unlockWindow,
    settleStep, derivedFlags, flagSamples, takeKeepsake, keepsakeFor,
    itemDef, ownedItems, hasItem, itemsOfKind, deliveredCount,
    notebookExtras, pocketSections, track, checkAchievements, addRapport,
  };
})(window);

</script>
<script data-part="roam.js">
/*!
 * 留一盏灯 · 漫游版  |  roam.js
 * 自由行动模式：场景上的人物标记、「看一看」、漫游对话框、
 * 校园地图（SVG 面板）与任务手账（委托日志）。
 * 状态与规则都在 game.js，内容在 quests.js；这里只负责呈现与输入。
 *
 * 这一版的三件新事：
 *   1. 道具会被人递来递去 —— 拿到手上有反馈，交出去也有。
 *   2. 同一组委托只能选一件 —— 选了谁，日志上会写明谁这个月没空。
 *   3. 熟到底的人会给你一件只属于你们的东西。
 */
(function (global) {
  'use strict';
  const SP = global.SP;
  const { $, h, clear } = SP;
  const Game = SP.game;

  const Roam = {
    active: false,
    windowId: null,     // 当前漫游窗口 w1..w5
    pendingNext: null,  // 继续主线时 go() 的目标节点
    convo: null,        // 当前漫游对话 { queue, seg, li }
  };

  /* ================================ 进入 / 退出 ================================ */

  function shouldGate(nodeId) {
    return !!Game.windowOf(nodeId);
  }

  function enter(nextId, restoring = false) {
    if (Roam.active) return;
    const gateId = SP.engine.state.id;
    const wid = Game.windowOf(gateId);
    if (!wid) return;
    Roam.leaveOK = false;
    Roam.active = true;
    Roam.windowId = wid;
    Roam.pendingNext = nextId;

    const w = Game.unlockWindow(wid);
    const node = SP.story.NODES[gateId] || {};
    if (!restoring && Game.LOCS[node.scene]) Game.onReach(node.scene);

    if (restoring) {
      SP.engine.stopTyping();
      SP.stage.setScene(w.loc, { time: SP.engine.lastTime || 'afternoon', weather: SP.engine.lastWeather || 'fair', transition: 'fade' });
      SP.audio.setScene(w.loc, SP.engine.lastWeather || 'fair');
    }
    SP.engine.stopAuto();
    SP.engine.auto = false;
    SP.engine.skip = false;
    SP.ui.syncModes();

    $('#dialogue').classList.add('hidden');
    $('#choices').classList.add('hidden');
    $('#roamLayer').classList.remove('hidden');
    renderHUD();
    renderScene();

    // 不再说「现在是自由时间」——接着上一段的口气往下讲
    const win = Game.WINDOWS[wid];
    if (!w.roamIntro) {
      w.roamIntro = true;
      SP.ui.toast(win.theme, 4400);
      // 第一次进漫游，把这个月「要定的事」逐件点名，免得玩家不知道该干嘛
      const left = undecidedGroups(wid);
      const msg = left.length
        ? '这个月有 ' + left.length + ' 件事要定：' + left.map((g) => Game.GROUPS[g].title).join('、')
          + '。去地图上亮着名字的地方找人聊——答应后记得完成并交差，故事才会记住这件事。'
        : '亮着名字的人都可以聊聊。';
      setTimeout(() => SP.ui.toast(msg, 6400), 1700);
    } else {
      SP.ui.toast(win.theme, 3600);
    }
    SP.engine.saveAuto();
  }

  function hide() {
    if (!Roam.active && $('#roamLayer').classList.contains('hidden')) return;
    Roam.active = false;
    closeRoamDialog();
    hideLookCard();
    $('#roamLayer').classList.add('hidden');
    $('#dialogue').classList.remove('hidden');
  }

  function reset() {
    Roam.active = false;
    Roam.windowId = null;
    Roam.pendingNext = null;
    Roam.convo = null;
    hide();
  }

  /** 这个窗口里还没定下来的互斥组 */
  function undecidedGroups(wid) {
    const w = Game.ensure();
    return Object.keys(Game.GROUPS).filter((g) => {
      if (Game.GROUPS[g].window !== wid) return false;
      return !Object.keys(Game.QUESTS).some((q) => Game.QUESTS[q].group === g && w.quests[q] && w.quests[q].done);
    });
  }

  function continueMain() {
    if (!Roam.active) return;
    const w = Game.ensure();
    const win = Game.WINDOWS[Roam.windowId];
    if (w.loc !== win.target) {
      SP.ui.toast('先去' + Game.LOCS[win.target].name + '——' + win.hint);
      return;
    }
    const left = undecidedGroups(Roam.windowId);
    if (left.length && !Roam.leaveOK) {
      confirmLeave(left);
      return;
    }
    Roam.leaveOK = false;
    const next = Roam.pendingNext;
    hide();
    SP.audio.sfx('whoosh');
    SP.engine.go(next);
  }

  /** 还有事没定时，把「没做的会怎样」说清楚，再让人决定走不走 */
  function confirmLeave(groups) {
    const names = groups.map((g) => Game.GROUPS[g].title);
    const panel = SP.ui.openPanel(h('div', {},
      SP.ui.head('先走也行', '漫游 · ' + Game.WINDOWS[Roam.windowId].title.replace(' · 自由活动', '')),
      h('p', { text: '这个月还有 ' + groups.length + ' 件事尚未交差：' + names.join('、') + '。' }),
      h('p', { text: '答应只是开始，完成并交差后才会影响接下来的主线。手上的委托会保留，但已经读过的情节不会追溯改写。' }),
      h('div', { class: 'panel-actions' },
        SP.ui.btn('我再想想', 'ghost', () => { SP.ui.closePanel(); }),
        SP.ui.btn('就这样，继续主线', 'primary', () => {
          Roam.leaveOK = true;
          SP.ui.closePanel();
          continueMain();
        }))
    ), { mode: 'roam-confirm' });
    return panel;
  }

  /* ================================= 场景标记 ================================= */

  function renderScene() {
    const layer = $('#npcLayer');
    clear(layer);
    if (!Roam.active) return;
    const w = Game.ensure();
    const wid = Roam.windowId;

    for (const npcId of Game.npcsHere(w.loc, wid)) {
      const spot = Game.npcAt(npcId, wid);
      const def = Game.NPCS[npcId];
      const busy = Game.npcHasBusiness(npcId, wid);
      const gift = !!Game.keepsakeFor(npcId);
      layer.append(
        h('button.npc-spot', {
          type: 'button',
          // h() 只解析 .class 片段，额外类名必须走 attrs
          class: (busy ? 'busy ' : '') + (gift ? 'gift' : ''),
          data: { npc: npcId },
          style: { left: spot.x + '%', top: spot.y + '%' },
          title: def.name,
          onclick: () => openRoamDialog(npcId),
        },
          h('span.npc-face', { html: SP.character.build(npcId, 'calm') }),
          h('span.npc-name', { text: def.name + (def.phone ? ' · 电话' : '') }),
          gift ? h('span.npc-gift') : (busy ? h('span.npc-dot') : null)
        )
      );
    }

    // 「看一看」热点
    const look = $('#lookSpot');
    if (Game.LOCS[w.loc]) {
      look.classList.remove('hidden');
      look.textContent = '✦ 看看这里';
      look.onclick = () => doObserve();
    } else {
      look.classList.add('hidden');
    }
    updatePlaceChip();
  }

  function updatePlaceChip() {
    const w = Game.ensure();
    const chip = $('#placeChip');
    if (chip && Roam.active && w.loc && Game.LOCS[w.loc]) {
      chip.textContent = '漫游 · ' + Game.LOCS[w.loc].name;
    }
  }

  function doObserve() {
    if (!Roam.active) return;
    const w = Game.ensure();
    const r = Game.onObserve(w.loc, Roam.windowId);
    SP.audio.sfx('click');
    showLookCard(Game.LOCS[w.loc].name, r.text);
    if (r.hit && r.hit.length) {
      for (const res of r.hit) {
        announceItems(res);
        SP.ui.toast('委托推进：《' + Game.QUESTS[res.qid].title + '》', 3000);
      }
    }
    if (r.egg) {
      const d = Game.itemDef(r.egg);
      if (d) {
        SP.audio.sfx('unlock');
        SP.ui.toast('角落里有个东西：《' + d.name + '》', 3600);
        flyItem(r.egg, 'in');
        flightPocket();
      }
    }
    renderHUD();
    SP.engine.saveAuto();
  }

  function showLookCard(title, text) {
    let card = $('#lookCard');
    if (!card) {
      card = h('div.look-card', { id: 'lookCard', class: 'hidden' });
      $('#roamLayer').append(card);
    }
    clear(card);
    card.append(
      h('div.look-title', { text: title }),
      h('p.look-text', { text })
    );
    card.classList.remove('hidden');
    card.onclick = () => hideLookCard();
  }

  function hideLookCard() {
    const card = $('#lookCard');
    if (card) card.classList.add('hidden');
  }

  /* ================================ 道具反馈 ================================ */

  /**
   * 一件东西被收下 / 被交出去时的那点动静。
   * 不是装饰：口袋从前只装纸片，现在装的是别人递过来的东西，
   * 得让人看见它确实进了口袋、也确实交出去了。
   */
  function flyItem(itemId, dir) {
    const d = Game.itemDef(itemId);
    if (!d) return;
    const layer = $('#roamLayer');
    if (!layer) return;
    const el = h('div.item-fly', {
      class: 'item-fly ' + (dir === 'out' ? 'out' : 'in'),
      text: d.icon + '　' + d.name,
    });
    layer.append(el);
    setTimeout(() => el.remove(), 1100);
  }

  /** 口袋键的角标：0 就藏起来 */
  function setPocketBadge(btn, n) {
    if (n > 0) btn.dataset.badge = String(n);
    else delete btn.dataset.badge;
  }

  function flightPocket() {
    const btn = $('#pocketBtn');
    if (!btn) return;
    btn.classList.remove('bump');
    void btn.offsetWidth;
    btn.classList.add('bump');
    setTimeout(() => btn.classList.remove('bump'), 700);
  }

  /** 结算结果 → 提示（收下了什么、交出了什么） */
  function announceItems(res) {
    if (!res) return;
    const took = res.took || [], gave = res.gave || [];
    gave.forEach((id, i) => {
      const d = Game.itemDef(id);
      if (d) setTimeout(() => { SP.ui.toast('把《' + d.name + '》交了出去', 3000); flyItem(id, 'out'); }, i * 260);
    });
    took.forEach((id, i) => {
      const d = Game.itemDef(id);
      if (d) setTimeout(() => {
        SP.ui.toast('收进口袋：《' + d.name + '》', 3200);
        flyItem(id, 'in');
        flightPocket();
      }, 220 + i * 300);
    });
    if (took.length) setTimeout(() => SP.audio.sfx('click'), 240);
  }

  /** 好感度变化 → 一句看得见的反馈（几颗心，走到哪一档） */
  function announceRapport(npcId) {
    const name = (Game.NPCS[npcId] || {}).name || '';
    if (!name) return;
    const w = Game.ensure();
    const r = w.rapport[npcId] || 0;
    const dots = '●'.repeat(r) + '○'.repeat(Math.max(0, Game.RAPPORT_MAX - r));
    // 留念物已经拿过的，不再提示「还有东西要给你」
    const tail = (r >= Game.RAPPORT_MAX && !w.keepsakes.includes(npcId))
      ? '　——　他/她好像还有东西要给你' : '';
    SP.ui.toast('和' + name + '更熟了一点　' + dots + tail, 3200);
  }

  /* ================================= 漫游 HUD ================================ */

  function renderHUD() {
    if (!Roam.active) return;
    const w = Game.ensure();
    const win = Game.WINDOWS[Roam.windowId];
    const here = w.loc === win.target;
    const activeQ = Object.keys(w.quests || {}).filter((q) => w.quests[q] && !w.quests[q].done);
    const readyQ = activeQ.filter((q) => Game.questReadyToTurnIn(q));

    $('#roamObjText').textContent = win.hint + (here ? ' ——就是这里' : '');
    const go = $('#roamGoBtn');
    go.disabled = !here;
    go.textContent = here ? '继续主线 →' : '去' + Game.LOCS[win.target].name + '继续主线';

    const bits = [];
    if (activeQ.length) bits.push('手上 ' + activeQ.length + ' 件');
    if (readyQ.length) bits.push(readyQ.length + ' 件可交差');
    const left = undecidedGroups(Roam.windowId).length;
    if (left) bits.push(left + ' 件要定（找亮名字的人）');
    $('#roamQuestCount').textContent = bits.length ? bits.join(' · ') : '这个月的事都办完了';

    const btn = $('#pocketBtn');
    // 圆形图标键不塞文字了，数量走右上角的小角标（CSS 读 data-badge）
    if (btn) setPocketBadge(btn, Game.ownedItems().length);
  }

  /* ================================= 漫游对话 ================================= */

  function conversationQueue(npcId) {
    const wid = Roam.windowId;
    const w = Game.ensure();
    const spot = Game.npcAt(npcId, wid);
    const first = Game.onTalk(npcId, wid);   // 打招呼：好感 +1（每窗口一次）
    const q = [];

    // 熟到底了：先把那件只属于你们的东西给你
    const keep = Game.keepsakeFor(npcId);
    if (keep) q.push({ kind: 'keepsake', npc: npcId, lines: keep.lines, item: keep.item });

    for (const qid of Game.readyQuestsFor(npcId)) {
      q.push({ kind: 'turnin', qid, lines: Game.QUEST_LINES[qid].done });
    }
    for (const qid of Game.stepQuestsFor(npcId)) {
      const step = Game.currentStep(qid);
      q.push({ kind: 'step', qid, lines: Game.stepLines(qid, w.quests[qid].stage), step });
    }
    // 一次对话最多抛出一件新委托——一件说清楚了，再谈下一件
    const offers = Game.questsOfferable(npcId, wid);
    if (offers.length) {
      const qid = offers[0];
      const QD = Game.QUESTS[qid];
      q.push({
        kind: 'offer', qid, lines: Game.QUEST_LINES[qid].offer,
        acceptLines: Game.QUEST_LINES[qid].accept, group: QD.group || null,
      });
    }
    if (!q.length) {
      const lines = (first && spot.greet) ? spot.greet : Game.npcAgain(npcId, wid);
      q.push({ kind: 'chat', lines: lines.length ? lines : (spot.greet || []) });
    } else if (first && spot.greet) {
      q.unshift({ kind: 'chat', lines: [spot.greet[0]] });
    }
    return q;
  }

  function openRoamDialog(npcId) {
    if (Roam.convo) return;
    SP.audio.sfx('click');
    const def = Game.NPCS[npcId];
    Roam.convo = { npc: npcId, queue: conversationQueue(npcId), seg: 0, li: 0 };
    const dlg = $('#roamDialog');
    clear(dlg);
    dlg.append(
      h('div.rd-face', { html: SP.character.build(npcId, 'calm') }),
      h('div.rd-main', {},
        h('div.rd-name', { text: def.name + (def.phone ? ' · 电话' : '') }),
        h('p.rd-text', { id: 'rdText' }),
        h('div.rd-choices', { id: 'rdChoices' }),
        h('div.rd-foot', {},
          h('span.rd-hint', { text: '点击继续' }),
          h('button.rd-next', { type: 'button', id: 'rdNext', text: '继续 ▾' })
        )
      )
    );
    $('#rdNext').onclick = stepDialog;
    dlg.classList.remove('hidden');
    paintDialogLine();
    SP.engine.saveAuto(); // 首次寒暄获得的熟悉度也要持久化
    renderScene(); // busy 标记可能变化（打过招呼了）
  }

  /* 一行台词可以是一句话（说话人 = 当前对话对象），
   * 也可以是自己排好段的分段数组 —— 和主线正文用同一套 .seg-* 排版。 */
  function lineSegs(line, npcId) {
    const who = (Game.NPCS[npcId] || {}).name || '';
    if (Array.isArray(line)) {
      return line.map((x) => ({
        k: x && x.k === 'n' ? 'n' : (x && x.k === 'i' ? 'i' : 'd'),
        w: (x && x.w) || undefined,
        s: String((x && x.s) != null ? x.s : ''),
      })).filter((x) => x.s !== '');
    }
    return [{ k: 'd', w: who, s: String(line == null ? '' : line) }];
  }

  function paintDialogLine() {
    const c = Roam.convo;
    if (!c) return;
    const seg = c.queue[c.seg];
    const line = seg ? seg.lines[c.li] : '';
    const el = $('#rdText');
    clear(el);
    const list = lineSegs(line, c.npc);
    list.forEach((sg) => {
      const sp = document.createElement('span');
      sp.className = 'seg seg-' + sg.k;
      if (sg.w) sp.setAttribute('data-who', sg.w);
      sp.textContent = sg.s;
      el.appendChild(sp);
    });
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
    paintDialogFace();
    // 留念物这一刻：整屏看一次 CG（同一段只弹一次，收起后对话接着走）
    if (seg && seg.kind === 'keepsake' && !seg.cgShown) {
      seg.cgShown = true;
      openCg({ npc: seg.npc, item: seg.item, kicker: '留念 · ' + (Game.NPCS[seg.npc] || {}).name });
    }
    const next = $('#rdNext');
    if (next) {
      next.style.display = '';
      next.textContent = seg && c.li < seg.lines.length - 1 ? '继续 ▾' : (c.seg < c.queue.length - 1 ? '继续 ▾' : '合上 ✓');
    }
  }

  /** 留念物时刻：把 SVG 小头像换成那张只属于你们的 CG */
  function paintDialogFace() {
    const c = Roam.convo;
    if (!c) return;
    const face = document.querySelector('#roamDialog .rd-face');
    if (!face) return;
    const seg = c.queue[c.seg];
    const cg = seg && seg.kind === 'keepsake' && SP.cg && SP.cg[c.npc];
    if (cg && !face.classList.contains('cg')) {
      face.classList.add('cg');
      clear(face);
      face.append(h('img', { src: cg, alt: (Game.NPCS[c.npc] || {}).name || '' }));
    } else if (!cg && face.classList.contains('cg')) {
      face.classList.remove('cg');
      clear(face);
      face.append(h('span', { html: SP.character.build(c.npc, 'calm') }));
    }
  }

  /* ============================== 全屏 CG ============================== */

  let cgEl = null;

  /** 这个人给你的留念物是哪一件（手账里点 CG 时用来配字幕） */
  function keepsakeItemOf(npcId) {
    const K = Game.KEEPSAKES && Game.KEEPSAKES[npcId];
    return K ? K.item : null;
  }

  function motionOff() {
    return document.documentElement.dataset.motion === 'off'
      || !!(global.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  /**
   * 整屏看一张 CG：暗场压住画面，缓慢推镜 + 一道扫光 + 字幕逐级浮现。
   * 点任意处 / Esc / 空格 / 回车都能收回去——它只是「看」，不是关卡。
   */
  function openCg(cfg) {
    if (!cfg || !SP.cg || !SP.cg[cfg.npc]) return false;
    if (cgEl) closeCg(true);
    const name = (Game.NPCS[cfg.npc] || {}).name || '';
    const def = cfg.item ? Game.itemDef(cfg.item) : (keepsakeItemOf(cfg.npc) ? Game.itemDef(keepsakeItemOf(cfg.npc)) : null);
    cgEl = h('div.cgstage', {
      class: 'cgstage' + (motionOff() ? ' still' : ''),
      role: 'dialog', 'aria-modal': 'true',
      'aria-label': (name ? name + ' 的' : '') + '留念 CG',
      onclick: () => closeCg(),
    },
      h('div.cg-art', {}, h('img.cg-img', { src: SP.cg[cfg.npc], alt: name })),
      h('div.cg-glow'),
      h('div.cg-sweep'),
      h('div.cg-vig'),
      h('div.cg-cap', {},
        h('span.cg-kicker', { text: cfg.kicker || '留念' }),
        h('span.cg-name', { text: name }),
        def ? h('span.cg-item', { text: '「' + def.name + '」' }) : null,
        h('span.cg-hint', { text: '点击任意处继续' })
      )
    );
    document.body.append(cgEl);
    document.addEventListener('keydown', cgKey, true);
    SP.audio.sfx('cg');
    return true;
  }

  function closeCg(immediate) {
    if (!cgEl) return;
    const el = cgEl;
    cgEl = null;
    document.removeEventListener('keydown', cgKey, true);
    if (immediate) { el.remove(); return; }
    el.classList.add('gone');
    setTimeout(() => el.remove(), 460);
  }

  /** 看 CG 的时候，空格/回车先用来「收起」，别让它顺手翻了剧情 */
  function cgKey(e) {
    if (!cgEl) return;
    if (e.key === 'Escape' || e.key === 'Esc' || e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      closeCg();
    }
  }

  function stepDialog() {
    const c = Roam.convo;
    if (!c) return;
    const seg = c.queue[c.seg];
    if (!seg) { closeRoamDialog(); return; }
    const box = $('#rdChoices');
    if (box && box.children.length) return;            // 选项待选，「继续」先不作数
    if (c.li < seg.lines.length - 1) {
      c.li++;
      SP.audio.sfx('hover');
      paintDialogLine();
      return;
    }
    if (seg.kind === 'offer' && !seg.offered) {        // 台词放完 → 给出「答应 / 先不了」
      seg.offered = true;
      showOfferChoices(seg);
      return;
    }
    applySegment(seg);
    if (c.seg < c.queue.length - 1) {
      c.seg++;
      c.li = 0;
      paintDialogLine();
      return;
    }
    closeRoamDialog();
  }

  function applySegment(seg) {
    if (!seg) return;
    if (seg.kind === 'turnin') {
      const r = Game.complete(seg.qid);
      if (r) {
        SP.ui.toast('收进口袋：《' + r.note.title + '》', 3600);
        announceRapport(r.rapport);
        if (r.group) SP.ui.toast('《' + Game.GROUPS[r.group].title + '》这件事，就按这个走下去了', 3600);
        renderHUD();
        SP.engine.syncWorldFlags();
        SP.engine.saveAuto();
      } else {
        // 只是把「同一组里已经选了别的」说清楚
        SP.ui.toast('已经交差了', 2000);
      }
    } else if (seg.kind === 'step') {
      const r = Game.advance(seg.qid);
      if (r) {
        announceItems(r);
        const step = Game.currentStep(seg.qid);
        if (step) SP.ui.toast('下一步：' + step.desc, 4200);
        else SP.ui.toast('《' + Game.QUESTS[seg.qid].title + '》可以交差了', 3600);
      }
      renderHUD();
      renderScene();
      SP.engine.saveAuto();
    } else if (seg.kind === 'keepsake') {
      const r = Game.takeKeepsake(seg.npc);
      if (r) {
        SP.audio.sfx('keepsake');
        SP.ui.toast('收进口袋：《' + r.def.name + '》', 4200);
        setTimeout(() => SP.ui.toast('这件东西只给了你一个人', 3200), 900);
        flyItem(r.item, 'in');
        flightPocket();
        renderHUD();
        renderScene();
        SP.engine.saveAuto();
      }
    }
  }

  /** offer 段落放完台词后展示的两个选项 */
  function showOfferChoices(seg) {
    const box = $('#rdChoices');
    clear(box);
    // 互斥提示：同一组里接了这件，另外几件这个月就来不及了
    if (seg.group) {
      const sibs = Object.keys(Game.QUESTS)
        .filter((q) => q !== seg.qid && Game.QUESTS[q].group === seg.group && Game.questState(q) === 'offer');
      if (sibs.length) {
        box.append(h('p.rd-groupnote', {
          text: '〔' + Game.GROUPS[seg.group].title + '〕' + Game.GROUPS[seg.group].blurb
            + '　答应这件，' + sibs.map((q) => '《' + Game.QUESTS[q].title + '》').join('、')
            + '这个月就做不了了——完成并交差后，主线才会按这件事往下走。',
        }));
      }
    }
    box.append(
      h('button.rd-choice.primary', { type: 'button', text: '答应下来' }),
      h('button.rd-choice.ghost', { type: 'button', text: '先不了' })
    );
    $('#rdNext').style.display = 'none';
    const [yes, no] = box.querySelectorAll('button.rd-choice');
    yes.onclick = () => {
      const r = Game.accept(seg.qid);
      clear(box);
      SP.audio.sfx('choice');
      if (r && r.group) {
        const sibs = Object.keys(Game.QUESTS).filter((q) => q !== seg.qid && Game.QUESTS[q].group === r.group);
        if (sibs.length) {
          const names = sibs.map((q) => Game.NPCS[Game.QUESTS[q].giver].name).join('、');
          SP.ui.toast('你把这个月的时间给了这边——' + names + '那边，只能等下次了', 4800);
        }
      }
      // 接完立刻告诉玩家第一步去哪——别让人拿着委托发愣
      const step0 = Game.currentStep(seg.qid);
      if (step0) setTimeout(() => SP.ui.toast('下一步：' + step0.desc, 4600), 1400);
      seg.kind = 'chat';
      seg.lines = seg.acceptLines || [];
      Roam.convo.li = 0;
      Roam.convo.queue = Roam.convo.queue.slice(0, Roam.convo.seg + 1);
      $('#rdNext').style.display = '';
      paintDialogLine();
      renderHUD();
      renderScene();
      SP.engine.saveAuto();
    };
    no.onclick = () => {
      SP.audio.sfx('hover');
      clear(box);
      SP.ui.toast('这件事先留着，听听还有什么事。', 2400);
      const c = Roam.convo;
      if (c && c.seg < c.queue.length - 1) { c.seg++; c.li = 0; paintDialogLine(); }
      else closeRoamDialog();
    };
  }

  function closeRoamDialog() {
    Roam.convo = null;
    const dlg = $('#roamDialog');
    if (dlg) dlg.classList.add('hidden');
  }

  /* ================================== 旅行 ================================== */

  function travel(loc) {
    if (!Game.LOCS[loc]) return;
    const w = Game.ensure();
    if (!w.unlocked.includes(loc)) {
      const wid = unlockWindowFor(loc);
      SP.ui.toast('还没去过——' + (wid ? Game.WINDOWS[wid].title.replace(' · 自由活动', '') + '以后才开放' : '暂时去不了'), 2800);
      return;
    }
    if (!Roam.active) {
      SP.ui.toast('故事进行中，这一段先看完再自由活动', 2600);
      return;
    }
    if (loc === w.loc) { SP.ui.closePanel(); return; }
    const hit = Game.onReach(loc);
    SP.audio.sfx('whoosh');
    SP.stage.setScene(loc, {
      time: SP.engine.lastTime || 'afternoon',
      weather: SP.engine.lastWeather || 'fair',
      transition: 'fade',
    });
    SP.audio.setScene(loc, SP.engine.lastWeather || 'fair');
    closeRoamDialog();
    hideLookCard();
    SP.ui.closePanel();
    renderScene();
    renderHUD();
    for (const res of hit) {
      announceItems(res);
      SP.ui.toast('委托推进：《' + Game.QUESTS[res.qid].title + '》', 3000);
    }
    SP.engine.saveAuto();
  }

  function unlockWindowFor(loc) {
    for (const wid of ['w2', 'w3', 'w4', 'w5']) {
      if (Game.WINDOWS[wid].unlocks.includes(loc)) return wid;
    }
    return null;
  }

  /* ================================== 地图 ================================== */

  function locQuestMark(loc) {
    if (!Roam.active) return null;
    const wid = Roam.windowId;
    const w = Game.ensure();
    let mark = null;
    for (const qid in w.quests) {
      const q = w.quests[qid];
      if (q.done) continue;
      const Q = Game.QUESTS[qid];
      if (q.stage >= Q.steps.length) {
        if (Game.npcAt(Q.giver, wid) && Game.npcAt(Q.giver, wid).loc === loc) mark = 'turnin';
      } else {
        const step = Q.steps[q.stage];
        if (step && ((step.at === loc) || (step.type === 'talk' && Game.npcAt(step.npc, wid) && Game.npcAt(step.npc, wid).loc === loc))) mark = 'step';
      }
    }
    if (!mark) {
      for (const qid in Game.QUESTS) {
        if (Game.QUESTS[qid].window !== wid) continue;
        if (Game.questState(qid) !== 'offer') continue;
        const spot = Game.npcAt(Game.QUESTS[qid].giver, wid);
        if (spot && spot.loc === loc) { mark = 'offer'; break; }
      }
    }
    if (!mark) {
      for (const npcId in Game.NPCS) {
        if (!Game.keepsakeFor(npcId)) continue;
        const spot = Game.npcAt(npcId, wid);
        if (spot && spot.loc === loc) { mark = 'gift'; break; }
      }
    }
    return mark;
  }

  function mapSVG() {
    const w = Game.ensure();
    const target = Roam.active ? Game.WINDOWS[Roam.windowId].target : null;
    const roadD = Game.LOC_ROADS.map(([a, b]) => {
      const A = Game.LOCS[a], B = Game.LOCS[b];
      return `M${A.x} ${A.y} L${B.x} ${B.y}`;
    }).join(' ');
    const trees = [[160, 380], [178, 366], [200, 344], [222, 330], [246, 310], [268, 296]]
      .map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4.5" class="map-tree"/>`).join('');

    let out = `<svg viewBox="0 0 720 520" class="map-svg" role="img" aria-label="校园地图">
      <rect x="8" y="8" width="704" height="504" rx="18" class="map-frame"/>
      <text x="30" y="40" class="map-title">校园导览</text>
      <g transform="translate(676 44)"><circle r="16" class="map-compass"/><path d="M0 -11 L4 6 L0 2 L-4 6 Z" class="map-needle"/><text y="30" class="map-n">北</text></g>
      <path d="${roadD}" class="map-road"/>
      <ellipse cx="540" cy="428" rx="86" ry="44" class="map-lake"/>
      <ellipse cx="540" cy="428" rx="60" ry="28" class="map-lake2"/>
      <text x="540" y="432" class="map-lake-label" text-anchor="middle">湖</text>
      <ellipse cx="612" cy="88" rx="58" ry="36" transform="rotate(-16 612 88)" class="map-track"/>
      ${trees}`;

    for (const id in Game.LOCS) {
      const L = Game.LOCS[id];
      const unlocked = w.unlocked.includes(id);
      const current = w.loc === id;
      const isTarget = target === id;
      const mark = locQuestMark(id);
      const eggLeft = L.egg && !w.items.includes(L.egg);
      const shape = id === 'track'
        ? `<ellipse cx="0" cy="0" rx="26" ry="17" class="loc-box"/>`
        : id === 'lake'
          ? `<path d="M-20 8 Q-16 -12 6 -10 Q24 -8 22 6 Q18 16 -2 14 Z" class="loc-box"/>`
          : `<rect x="-24" y="-16" width="48" height="32" rx="7" class="loc-box" transform="rotate(${(L.x % 3) - 1})"/>`;
      let markers = '';
      if (current) markers += `<circle cx="0" cy="0" r="30" class="loc-ring"/><circle cx="0" cy="0" r="5" class="loc-dot"/>`;
      if (eggLeft && unlocked) markers += `<circle cx="-22" cy="-20" r="4" class="loc-egg"/>`;
      if (mark) markers += `<rect x="18" y="-24" width="10" height="10" class="loc-qmark loc-qmark-${mark}" transform="rotate(45 23 -19)"/>`;
      if (isTarget) markers += `<path d="M0 -34 l4.5 9 10 1.5 -7 7 1.6 10 -9.1 -4.8 -9.1 4.8 1.6 -10 -7 -7 10 -1.5 Z" class="loc-star"/>`;
      out += `<g class="loc ${unlocked ? '' : 'locked'} ${current ? 'current' : ''}" data-loc="${id}" transform="translate(${L.x} ${L.y})" tabindex="0" role="button" aria-label="${L.name}${unlocked ? '' : '（未开放）'}">
        ${shape}${markers}<text y="34" text-anchor="middle" class="loc-name">${L.name}</text></g>`;
    }
    out += '</svg>';
    return out;
  }

  function openMap() {
    if (SP.ui.isPanelOpen()) return;
    const w = Game.ensure();
    const win = Roam.active ? Game.WINDOWS[Roam.windowId] : null;
    const wrap = h('div', {},
      h('div.map-svg-wrap', { html: mapSVG() }),
      h('div.map-legend', {},
        h('span', { html: '<i class="lg lg-cur"></i>你在这里' }),
        h('span', { html: '<i class="lg lg-q"></i>有委托或有人找你' }),
        h('span', { html: '<i class="lg lg-star"></i>主线目标' }),
        h('span', { html: '<i class="lg lg-egg"></i>还有没捡到的小东西' }),
        h('span', { html: '<i class="lg lg-lock"></i>还没开放' })
      ),
      h('p.map-note', {
        text: win
          ? '点击开放的地方即可前往' + (win ? '；带 ★ 的是主线目标：' + win.hint : '')
          : '现在正在看故事——章节之间可以自由活动，到时候再到处走走。',
      })
    );
    const panel = SP.ui.openPanel(h('div', {},
      SP.ui.head('校园地图', Roam.active ? Game.WINDOWS[Roam.windowId].title : '自由行动'),
      wrap), { wide: true, mode: 'map' });
    panel.querySelectorAll('.loc').forEach((el) => {
      const go = () => travel(el.dataset.loc);
      el.addEventListener('click', go);
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
    SP.audio.sfx('click');
  }

  /* ================================= 任务手账 ================================= */

  const STATE_LABEL = {
    active: '进行中', ready: '可以交差', done: '已完成', abandoned: '这个月没空', locked: '还没到时候',
  };

  function questCard(qid, w) {
    const Q = Game.QUESTS[qid];
    const st = w.quests[qid];
    const state = Game.questState(qid);
    // 一件 step 可能同时收下/交出好几样东西，所以这里得把数组摊开
    const namesOf = (v) => (v == null ? '' : (Array.isArray(v) ? v : [v])
      .map((id) => (Game.itemDef(id) || {}).name || id).join('、'));
    const items = [];
    if (st) {
      Q.steps.forEach((s, i) => {
        const done = i < st.stage;
        const now = i === st.stage;
        items.push(h('li.q-step', { class: done ? 'done' : now ? 'now' : null },
          h('span.q-mark', { text: done ? '✓' : now ? '●' : '○' }),
          h('span', { text: s.desc }),
          s.take ? h('em.q-item', { text: '＋' + namesOf(s.take) }) : null,
          s.give ? h('em.q-item.out', { text: '－' + namesOf(s.give) }) : null
        ));
      });
      items.push(h('li.q-step', { class: state === 'ready' ? 'now' : (st.done ? 'done' : null) },
        h('span.q-mark', { text: st.done ? '✓' : state === 'ready' ? '★' : '○' }),
        h('span', { text: '回去找' + Game.NPCS[Q.giver].name })
      ));
    } else {
      items.push(h('li.q-step', {},
        h('span.q-mark', { text: '·' }),
        h('span', { text: Q.hint })
      ));
    }
    return h('article.q-card', { class: state === 'ready' ? 'ready' : (state === 'abandoned' ? 'abandoned' : null) },
      h('div.q-title-row', {},
        h('h3', { text: Q.title }),
        state === 'ready' ? h('span.q-badge', { text: '可以交差' })
          : state === 'abandoned' ? h('span.q-badge.off', { text: '这个月没空' })
            : null
      ),
      h('div.q-from', { text: Game.NPCS[Q.giver].name + ' 拜托的事' + (Q.group ? ' · ' + Game.GROUPS[Q.group].title : '') }),
      h('ul.q-steps', {}, ...items)
    );
  }

  function openJournal() {
    if (SP.ui.isPanelOpen()) return;
    const w = Game.ensure();
    const wid = Roam.windowId;
    const active = [], ready = [], abandoned = [];
    for (const qid in w.quests) {
      const st = w.quests[qid];
      if (st.done) continue;
      if (st.stage >= Game.QUESTS[qid].steps.length) ready.push(qid);
      else active.push(qid);
    }
    const done = w.notes.slice();
    if (wid) abandoned.push(...Game.abandonedQuests(wid));
    const offers = wid ? Object.keys(Game.QUESTS).filter((qid) =>
      Game.QUESTS[qid].window === wid && Game.questState(qid) === 'offer') : [];

    const left = wid ? undecidedGroups(wid) : [];
    const main = Roam.active
      ? h('div.j-main', {},
        h('div.eyebrow', { text: '主线' }),
        h('p', { text: Game.WINDOWS[wid].hint + '（地图上标 ★ 的地方）' }),
        left.length
          ? h('p', { class: 'j-sub', text: '还没定的事 ' + left.length + ' 件：' + left.map((g) => Game.GROUPS[g].title).join('、')
              + '。去找地图上亮名字的人，答应谁，就定了哪件。' })
          : null)
      : h('div.j-main', {},
        h('div.eyebrow', { text: '主线' }),
        h('p', { text: '故事进行中——到章节之间的自由活动时间，再来翻这一页。' }));

    const offerList = offers.length
      ? h('div.j-section', {},
        h('h2', { text: '听说的事 ' + offers.length }),
        h('p.j-sub', { text: '这些人有事想找你。带〔 〕的是同一件事的两三种做法，互斥：答应一件，其余这个月就来不及了——主线会记住你选了哪件。' }),
        ...offers.map((qid) => {
          const Q = Game.QUESTS[qid];
          return h('div.j-rumor', { class: Q.group ? 'grouped' : null },
            h('span', { text: '……' + Q.hint }),
            h('em', { text: '（找 ' + Game.NPCS[Q.giver].name + '）' }),
            Q.group ? h('em.j-group', { text: '〔' + Game.GROUPS[Q.group].title + '〕' }) : null);
        }))
      : null;

    const people = h('div.j-people', {},
      h('h2', { text: '熟悉的人' }),
      h('div.j-faces', {},
        ...Object.keys(Game.NPCS).map((npcId) => {
          const r = w.rapport[npcId] || 0;
          const full = r >= Game.RAPPORT_MAX;
          const hasCg = w.keepsakes.includes(npcId) && SP.cg && SP.cg[npcId];
          return h('div.j-face', { class: full ? 'full' : null },
            hasCg
              ? h('span.face.cg', {
                  title: '看 ' + Game.NPCS[npcId].name + ' 的 CG',
                  onclick: () => openCg({ npc: npcId, kicker: '人物 CG' }),
                }, h('img', { src: SP.cg[npcId], alt: Game.NPCS[npcId].name }))
              : h('span.face', { html: SP.character.build(npcId, 'calm') }),
            h('b', { text: Game.NPCS[npcId].name }),
            h('span.dots', { text: '●'.repeat(r) + '○'.repeat(Game.RAPPORT_MAX - r) }),
            full ? h('span.j-full', { text: w.keepsakes.includes(npcId) ? '留念已收' : '有东西要给你' }) : null);
        })));

    SP.ui.openPanel(h('div', {},
      SP.ui.head('任务手账', '漫游 · 委托与手记'),
      main,
      h('div.j-section', {},
        h('h2', { text: '手上的委托 ' + (active.length + ready.length) }),
        active.length || ready.length
          ? h('div.j-quests', {},
            ...ready.map((qid) => questCard(qid, w)),
            ...active.map((qid) => questCard(qid, w)))
          : h('p.j-sub', { text: '暂时没有。地图上亮着的名字，也许正在等你说一句“好的”。' })),
      abandoned.length
        ? h('div.j-section.off', {},
          h('h2', { text: '这个月没做的 ' + abandoned.length }),
          h('p.j-sub', { text: '同一件事你选了别人那一头。这些不会再来。' }),
          h('ul.j-done.off', {}, ...abandoned.map((qid) => h('li', {},
            h('span', { text: '· ' + Game.QUESTS[qid].title }),
            h('em', { text: Game.NPCS[Game.QUESTS[qid].giver].name })))))
        : null,
      offerList,
      h('div.j-section', {},
        h('h2', { text: '已完成 ' + done.length + ' / ' + Object.keys(Game.NOTES).length }),
        done.length
          ? h('ul.j-done', {}, ...done.map((qid) => h('li', {},
            h('span', { text: '✓ ' + Game.QUESTS[qid].title }),
            h('em', { text: Game.NOTES[qid].date }))))
          : h('p.j-sub', { text: '从一件小事开始，也挺好。' })),
      people), { wide: true, mode: 'journal' });
    SP.audio.sfx('click');
  }

  /* ================================== 导出 ================================== */

  SP.roam = {
    snapshot: () => Roam.active ? { next: Roam.pendingNext, windowId: Roam.windowId } : null,
    enter, hide, reset, shouldGate, continueMain,
    travel, openMap, openJournal,
    renderHUD, renderScene, updatePlaceChip, undecidedGroups,
    openCg, closeCg, cgOpen: () => !!cgEl,
    // 给外壳（安卓返回键、桌面窗口）留的收口：先合 CG，再合对话，最后收热点
    closeDialogue: () => { if (cgEl) { closeCg(); return; } closeRoamDialog(); },
    closeLook: hideLookCard,
    active: () => Roam.active,
    windowId: () => Roam.windowId,
  };
})(window);

</script>
<script data-part="ui.js">
/*!
 * 晴天以后 · v2  |  ui.js
 * 界面层：提示、成就弹窗、羁绊条、进度条、章节卡，以及全部面板（封面 / 菜单 /
 * 记录 / 存读档 / 设置 / 结局图鉴 / 成就 / 分支图 / 结局）。
 */
(function (global) {
  'use strict';
  const SP = global.SP;
  const { $, h, clear, clamp } = SP;
  const ST = SP.story;
  const SS = SP.storage;

  const CH_P_RANGES = [[0,20],[20,40],[40,60],[60,80],[80,100]];
  const BOND_META = [
    { key: 'man', name: '小满' },
    { key: 'yan', name: '阿言' },
    { key: 'family', name: '家人' },
    { key: 'self', name: '自己' },
  ];

  let lastFocus = null;

  /* -------------------------------- 提示 --------------------------------- */

  function toast(msg, ms = 2200) {
    const wrap = $('#toasts');
    const el = h('div.toast', { text: msg });
    wrap.append(el);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 420);
    }, ms);
  }

  function achievementPopup(id) {
    const a = ST.ACHIEVEMENTS.find((x) => x.id === id);
    if (!a) return;
    const wrap = $('#achPop');
    const el = h(
      'div.item',
      {},
      h('div.ic', { text: a.icon }),
      h('div', {}, h('b', { text: '成就解锁 · ' + a.name }), h('span', { text: a.desc }))
    );
    wrap.append(el);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 520);
    }, 3400);
  }

  /* ------------------------------ 羁绊 / 进度 ----------------------------- */

  function paintBonds(upKeys) {
    const box = $('#bonds');
    if (!box) return;
    if (!SS.getSettings().showBonds) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    if (!box.dataset.ready) {
      clear(box);
      box.append(h('div.bonds-title', { text: '羁 绊' }));
      for (const b of BOND_META) {
        box.append(
          h(
            'div.bond',
            { data: { bond: b.key } },
            h('span.bond-name', { text: b.name }),
            h('span.bond-track', {}, h('i.bond-fill')),
            h('span.bond-val', { text: '0' })
          )
        );
      }
      box.dataset.ready = '1';
    }
    const bonds = SP.engine.state ? SP.engine.state.bonds : {};
    for (const b of BOND_META) {
      const row = box.querySelector(`.bond[data-bond="${b.key}"]`);
      if (!row) continue;
      const v = clamp(bonds[b.key] || 0, 0, 10);
      row.querySelector('.bond-fill').style.width = (v / 10) * 100 + '%';
      row.querySelector('.bond-val').textContent = String(v);
      if (upKeys && upKeys.includes(b.key)) {
        row.classList.remove('up');
        void row.offsetWidth;
        row.classList.add('up');
        setTimeout(() => row.classList.remove('up'), 800);
      }
    }
  }

  function paintProgress(p) {
    const bar = $('#progressBar');
    if (!bar) return;
    if (!SS.getSettings().showProgress) { bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');
    if (!bar.dataset.ready) {
      clear(bar);
      for (let i = 0; i < CH_P_RANGES.length; i++) {
        const seg = h('span.seg', { title: (ST.CHAPTERS[i] || {}).name || '' }, h('i'));
        bar.append(seg);
      }
      bar.dataset.ready = '1';
    }
    const segs = bar.querySelectorAll('.seg i');
    CH_P_RANGES.forEach(([lo, hi], i) => {
      const v = p <= lo ? 0 : p >= hi ? 100 : ((p - lo) / (hi - lo)) * 100;
      if (segs[i]) segs[i].style.right = 100 - v + '%';
    });
  }

  function syncModes() {
    const set = (sel, on) => {
      const el = $(sel);
      if (el) el.setAttribute('aria-pressed', String(!!on));
    };
    set('#autoBtn', SP.engine.auto);
    set('#skipBtn', SP.engine.skip);
    set('#musicBtn', SP.audio.enabled);
    document.body.dataset.mode = SP.engine.auto ? 'auto' : SP.engine.skip ? 'skip' : 'normal';
  }

  /* ------------------------------- 章节卡 -------------------------------- */

  function showChapterCard(ch, cb) {
    const el = $('#chapterCard');
    el.innerHTML = '';
    el.append(
      h(
        'div.chapter-card-inner',
        {},
        h('div.cc-name', { text: ch.name }),
        h('div.cc-rule'),
        h('div.cc-sub', { text: ch.sub })
      )
    );
    el.classList.add('show');
    const wait = SP.stage.reduced ? 600 : 2200;
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => cb && cb(), 420);
    }, wait);
  }

  /* ------------------------------- 面板基座 ------------------------------ */

  function openPanel(content, opts = {}) {
    if(SP.engine){ SP.engine.stopAuto(); SP.engine.auto=false; SP.engine.skip=false; syncModes(); }
    const ov = $('#overlay');
    const panel = $('#panel');
    lastFocus = document.activeElement;
    panel.className = 'panel' + (opts.wide ? ' wide' : '') + (opts.cover ? ' cover' : '');
    clear(panel);
    panel.append(content);
    ov.classList.remove('hidden');
    ov.dataset.mode = opts.mode || 'default';
    document.body.classList.add('panel-open');
    SP.audio.sfx('panel', true);
    // 焦点交给面板本身（tabindex=-1），键盘用户按 Tab 进入控件，避免首个按钮被无意义高亮
    panel.setAttribute('tabindex', '-1');
    setTimeout(() => panel.focus({ preventScroll: true }), 40);
    return panel;
  }

  function closePanel() {
    const ov = $('#overlay');
    if (!ov.classList.contains('hidden')) SP.audio.sfx('panel', false);
    ov.classList.add('hidden');
    document.body.classList.remove('panel-open');
    const panel = $('#panel');
    clear(panel);
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }

  function isPanelOpen() {
    return !$('#overlay').classList.contains('hidden');
  }

  function head(title, eyebrow) {
    return h(
      'div.panel-head',
      {},
      eyebrow ? h('div.eyebrow', { text: eyebrow }) : null,
      h('h1', { text: title })
    );
  }

  function btn(label, cls, onclick) {
    return h('button.btn.' + cls, { type: 'button', onclick }, label);
  }

  /* -------------------------------- 封面 --------------------------------- */

  function showCover() {
    const prog = SS.getProgress();
    const total = Object.keys(ST.ENDINGS).length;
    const slots = SS.listSlots();
    const hasSave = slots.some((s) => !s.empty);
    SP.audio.setMood('cover');          // 封面上先有一段安静的前奏
    const panel = openPanel(
      h(
        'div',
        { style: { gap: '2px' } },
        h('div.eyebrow', { text: '晴天以后 · 校园短篇集 / 漫游版' }),
        h('h1', { text: '留一盏灯' }),
        h('p.lead', {
          text: '一个学期，一部还没剪完的短片。\n借来的设备、没对上的课表，和几个渐渐熟悉的人。\n最后一排，给晚到的人留着。',
        }),
        h(
          'div',
          { style: { display: 'flex', flexWrap: 'wrap', gap: '9px', justifyContent: 'center', marginTop: '10px' } },
          btn('开始故事', 'primary', () => {
            SP.audio.ensure();
            closePanel();
            SP.engine.restart();
          }),
          hasSave ? btn('继续上次', 'ghost', () => { closePanel(); openSaves('load'); }) : null
        ),
        h(
          'div.stat-row',
          {},
          h('div.stat', {}, h('b', { text: `${prog.endings.length}/${total}` }), h('span', { text: '结局' })),
          h('div.stat', {}, h('b', { text: `${prog.achievements.length}/${ST.ACHIEVEMENTS.length}` }), h('span', { text: '成就' })),
          h('div.stat', {}, h('b', { text: String(prog.clears || 0) }), h('span', { text: '通关次数' }))
        ),
        h(
          'div',
          { style: { display: 'flex', gap: '7px', flexWrap: 'wrap', justifyContent: 'center', marginTop: '14px' } },
          btn('结局图鉴', 'plain sm', () => openGallery(true)),
          btn('成就', 'plain sm', () => openAchievements(true)),
          btn('分支图', 'plain sm', () => openFlow(true)),
          btn('设置', 'plain sm', () => openSettings(true))
        ),
        h('div.fine', {
          text: '五章完整故事 · 六种后来 · 建议留出 40—60 分钟\n章节之间可以自由行动：逛校园、找人聊天、帮人办事。\n每个月的时间只够帮一部分人——你帮了谁，故事就往哪边走。\n随时存档，慢慢读。声音可在上方开启。',
        })
      ),
      { cover: true, mode: 'cover' }
    );
  }

  /* -------------------------------- 菜单 --------------------------------- */
  /* 口袋：从前只装纸片，现在装的是别人递过来的东西。
   * 分三层 —— 手上的事（还要交出去）、留念（熟到底才有）、角落里的小东西；
   * 纸片仍然收在最下面，和从前一样。 */
  function pocketItemCard(it) {
    return h('article.pocket-item', { class: 'k-' + it.kind },
      h('span.pi-icon', { text: it.icon || '▫' }),
      h('div.pi-body', {},
        h('b', { text: it.name }),
        it.from ? h('span.pi-from', { text: '来自 ' + it.from }) : null,
        h('p.pi-desc', { text: it.desc })
      )
    );
  }

  function openNotebook() {
    const ids = (SP.engine.state && SP.engine.state.memories) || [];
    const secs = (SP.game && SP.game.pocketSections) ? SP.game.pocketSections() : [];
    const pages = h('div.notebook-grid');
    for (const id of ids) {
      const m = ST.MEMORIES[id]; if (!m) continue;
      pages.append(h('article.notebook-page', {}, h('div.eyebrow', {text:m.date}), h('h2',{text:m.title}), h('p',{text:m.body})));
    }
    // 漫游版：委托换来的手记，与剧情纸片收在同一个口袋里
    const extras = (SP.roam && SP.game) ? SP.game.notebookExtras() : [];
    for (const m of extras) {
      pages.append(h('article.notebook-page.from-quest', {}, h('div.eyebrow', {text:m.date}), h('h2',{text:m.title}), h('p',{text:m.body})));
    }

    const total = (SP.game && SP.game.ownedItems) ? SP.game.ownedItems().length : 0;
    const body = h('div', {});
    if (secs.length) {
      for (const s of secs) {
        body.append(h('section.pocket-sec', { class: 'sec-' + s.key },
          h('h2', {}, h('span', { text: s.title }), h('em', { text: s.items.length })),
          h('p.pocket-sub', { text: s.sub }),
          h('div.pocket-grid', {}, ...s.items.map(pocketItemCard))
        ));
      }
    } else {
      body.append(h('p', { text: '口袋还是空的。别人递给你的东西、顺手捡的小东西、还有熟到最后那个人给你的东西，都会落在这儿。' }));
    }
    if (ids.length || extras.length) {
      body.append(h('section.pocket-sec.sec-note', {},
        h('h2', {}, h('span', { text: '纸片' }), h('em', { text: String(ids.length + extras.length) })),
        h('p.pocket-sub', { text: '剧情里收起的，和交差时落下的。' }),
        pages));
    }

    const eyebrow = total
      ? '口袋里 ' + total + ' 件东西'
      : '一张纸，也能记住一天';
    const panel = openPanel(h('div', {}, head('口袋里的东西', eyebrow), body), { wide: true, mode: 'notebook' });
    panel.append(h('div.panel-foot', {}, btn('收好，继续故事', 'primary', closePanel)));
  }

  function openMenu() {
    const prog = SS.getProgress();
    openPanel(
      h(
        'div',
        {},
        head('暂停一下', '晴天以后'),
        h('p', { text: '你的进度会自动保存。想继续时，故事会从这一段接上。' }),
        h(
          'div',
          { style: { display: 'grid', gap: '9px', marginTop: '10px' } },
          h(
            'div',
            { class: 'keys' },
            h('div', {}, h('kbd', { text: 'Space' }), '继续'),
            h('div', {}, h('kbd', { text: 'Esc' }), '菜单'),
            h('div', {}, h('kbd', { text: 'Backspace' }), '返回上一段'),
            h('div', {}, h('kbd', { text: 'A' }), '自动播放'),
            h('div', {}, h('kbd', { text: 'Ctrl' }), '按住快进已读'),
            h('div', {}, h('kbd', { text: '1-4' }), '选择选项')
          )
        ),
        h(
          'div',
          { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))', gap: '9px', marginTop: '18px' } },
          btn('继续故事', 'primary', closePanel),
          btn('故事记录', 'ghost', () => openLog(true)),
          btn('存档', 'plain', () => openSaves('save')),
          btn('读档', 'plain', () => openSaves('load')),
          btn('设置', 'plain', () => openSettings(true)),
          btn('结局图鉴', 'plain', () => openGallery(true)),
          btn('成就', 'plain', () => openAchievements(true)),
          btn('分支图', 'plain', () => openFlow(true)),
          btn('回到封面', 'plain', () => showCover()),
          btn('重新开始', 'danger', () => {
            if (confirm('重新开始会清空当前这一段进度（已解锁的结局与成就仍会保留）。确定吗？')) {
              closePanel();
              SP.engine.restart();
            }
          })
        ),
        h('div.fine', {
          text: `已解锁结局 ${prog.endings.length}/${Object.keys(ST.ENDINGS).length} · 成就 ${prog.achievements.length}/${ST.ACHIEVEMENTS.length}`,
        })
      ),
      { mode: 'menu' }
    );
  }

  /* -------------------------------- 记录 --------------------------------- */

  function openLog(fromPanel) {
    SS.unlockAchievement('reader') && achievementPopup('reader');
    const entries = SP.engine.state ? SP.engine.state.log : [];
    let filter = 'all';
    const body = h('div.panel-body.scroll');
    const list = h('div.log-list');
    body.append(list);

    const render = () => {
      clear(list);
      const items = entries.filter((e) => (filter === 'all' ? true : e.kind === filter));
      if (!items.length) {
        list.append(h('div.log-empty', { text: '还没有记录。走几步故事，这里就会长出来。' }));
        return;
      }
      items
        .slice()
        .reverse()
        .forEach((e) => {
          list.append(
            h(
              'div.log-entry' + (e.kind === 'choice' ? ' choice-pick' : e.kind === 'mine' ? ' mine' : e.kind === 'narr' ? ' narr' : ''),
              {},
              h(
                'div.meta',
                {},
                h('b', { text: e.kind === 'narr' ? '旁白' : (e.speaker || '') }),
                e.place ? h('span.tp', { text: e.place }) : null

  /* ------------------------------- 分支图 -------------------------------- */

  function openFlow(fromPanel) {
    const read = SS.getProgress().readNodes;
    const curriculum = SS.getProgress();
    const nodes = ST.NODES;
    const start = ST.START;
    // 漫游版的分岔由 flag 决定，节点 next 是函数：拿世界的取样把它摊开
    const samples = (SP.game && SP.game.flagSamples) ? SP.game.flagSamples() : [{}];
    const edges = ST.allEdges(samples);

    // 按 BFS 深度布局
    const depth = {};
    const order = [];
    const q = [start];
    depth[start] = 0;
    while (q.length) {
      const id = q.shift();
      order.push(id);
      const node = nodes[id];
      if (!node) continue;
      for (const [, to] of edges.filter((e) => e[0] === id)) {
        if (depth[to] == null) { depth[to] = depth[id] + 1; q.push(to); }
      }
    }
    const cols = {};
    order.forEach((id) => {
      const d = depth[id];
      (cols[d] = cols[d] || []).push(id);
    });
    const BW = 132, BH = 30, GX = 46, GY = 16, PAD = 20;
    let maxRows = 0;
    for (const d in cols) maxRows = Math.max(maxRows, cols[d].length);
    const width = PAD * 2 + (Object.keys(cols).length) * (BW + GX);
    const height = PAD * 2 + maxRows * (BH + GY);
    const pos = {};
    for (const d in cols) cols[d].forEach((id, i) => {
      pos[id] = { x: PAD + Number(d) * (BW + GX), y: PAD + i * (BH + GY) };
    });

    const edgeSvg = [];
    for (const [from, to] of edges) {
      if (!pos[from] || !pos[to]) continue;
      const a = pos[from], b = pos[to];
      const x1 = a.x + BW, y1 = a.y + BH / 2, x2 = b.x, y2 = b.y + BH / 2;
      const mx = (x1 + x2) / 2;
      const seen = read.includes(from) && read.includes(to);
      edgeSvg.push(
        `<path class="fl-edge${seen ? ' seen' : ''}" d="M ${x1} ${y1} C ${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"/>`
      );
    }

    const current = SP.engine.state ? SP.engine.state.id : null;
    const nodeSvg = order.map((id) => {
      const p = pos[id];
      if (!p) return '';
      const node = nodes[id];
      const seen = read.includes(id);
      const label = node.ending ? '结局' : (node.place || id);
      const branch = typeof node.next === 'function' || node.choices;
      const color = node.ending ? '#c9714f' : branch ? '#4f9187' : '#6b8fae';
      return (
        `<g class="fl-node${seen ? '' : ' unread'}${id === current ? ' current' : ''}">` +
        `<rect x="${p.x}" y="${p.y}" width="${BW}" height="${BH}" rx="8" fill="${color}"/>` +
        `<text x="${p.x + BW / 2}" y="${p.y + BH / 2 + 4}" text-anchor="middle">${String(label).slice(0, 9)}</text></g>`
      );
    }).join('');

    const wrap = h('div.flow-wrap.scroll', {
      html: `<div class="flow"><svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">${edgeSvg.join('')}${nodeSvg}</svg></div>`,
    });

    const panel = openPanel(
      h('div', {}, head('分支图', '这一学期有多少条路'),
        h('p', { text: `共 ${order.length} 个场景节点、${edges.length} 条连接。绿框是会分岔的地方——走哪一条，由这个月在自由活动里把时间花在谁身上决定。` }),
        wrap,
        h('div.legend', {},
          h('span', {}, h('i', { style: { background: '#4f9187' } }), '会分岔的节点'),
          h('span', {}, h('i', { style: { background: '#6b8fae' } }), '普通节点'),
          h('span', {}, h('i', { style: { background: '#c9714f' } }), '结局'),
          h('span', {}, h('i', { style: { background: 'var(--ui-line)' } }), '未走过的部分')
        )
      ),
      { wide: true, mode: 'flow' }
    );
    panel.append(h('div.panel-foot', {}, btn('返回', 'plain', closePanel)));
  }

  /* -------------------------------- 结局 --------------------------------- */

  function worldOf() {
    return (SP.game && SP.game.ensure) ? SP.game.ensure() : null;
  }
  function doneCount() {
    const w = worldOf();
    if (!w) return 0;
    return Object.keys(w.quests || {}).filter((q) => w.quests[q].done).length;
  }
  function pocketCount() {
    return (SP.game && SP.game.ownedItems) ? SP.game.ownedItems().length : 0;
  }

  /* 尾声补记：读的是这一局真实做过的事，不再读那些已经消失的 flag */
  function endingExtras() {
    const f = SP.engine.state.flags;
    const out = [];
    if (f.night === 'stop') out.push('寝室的群公告还留着那句话：今晚不再加镜头。');
    const w = (SP.game && SP.game.ensure) ? SP.game.ensure() : null;
    if (w) {
      const done = Object.keys(w.quests || {}).filter((q) => w.quests[q].done).length;
      if (done) out.push('这一学期，你替别人办了 ' + done + ' 件事。');
      const full = Object.keys(w.rapport || {}).filter((n) => w.rapport[n] >= SP.game.RAPPORT_MAX);
      if (full.length) out.push('熟到不能再熟的人：' + full.map((n) => SP.game.NPCS[n].name).join('、') + '。');
      const eggs = SP.game.itemsOfKind('egg').length;
      if (eggs) out.push('口袋里还躺着 ' + eggs + ' 件在角落里顺手捡的小东西。');
      const held = SP.game.itemsOfKind('quest').length;
      if (held) out.push('有 ' + held + ' 件别人给的东西还在你手上——总得还回去。');
    }
    return out;
  }
