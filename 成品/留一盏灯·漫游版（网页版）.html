        {},
        btn('再走一条路', 'primary', () => { closePanel(); SP.engine.restart(); }),
        btn('回看故事', 'ghost', () => openLog(true)),
        btn('保存结局卡', 'ghost', () => exportEndingCard(e, extras)),
        btn('结局图鉴', 'plain', () => openGallery(true)),
        btn('回到封面', 'plain', () => showCover())
      )
    );
  }

  /** 用 canvas 现场画一张分享用的结局卡 */
  function exportEndingCard(e, extras) {
    try {
      const W = 1200, H = 760;
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const g = cv.getContext('2d');
      const stage = SP.stage.el;
      const cs = getComputedStyle(stage);
      const c = (name, fb) => (cs.getPropertyValue(name) || fb).trim() || fb;
      const sky1 = c('--sky-1', '#8fc9dd'), sky2 = c('--sky-2', '#cde5dd'), sky3 = c('--sky-3', '#eff1dd');
      const ink = c('--c-ink', '#3c5a5a'), warm = c('--c-warm', '#fff2cb'), mid = c('--c-mid', '#8fae9c');

      const grad = g.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, sky1); grad.addColorStop(0.55, sky2); grad.addColorStop(1, sky3);
      g.fillStyle = grad; g.fillRect(0, 0, W, H);

      g.globalAlpha = 0.9; g.fillStyle = warm;
      g.beginPath(); g.arc(W - 200, 150, 74, 0, Math.PI * 2); g.fill();
      g.globalAlpha = 0.25; g.beginPath(); g.arc(W - 200, 150, 160, 0, Math.PI * 2); g.fill();

      g.globalAlpha = 0.85; g.fillStyle = mid;
      g.beginPath(); g.moveTo(-60, H); g.quadraticCurveTo(320, H - 300, 760, H - 120); g.quadraticCurveTo(1000, H - 30, W + 60, H - 130); g.lineTo(W + 60, H); g.closePath(); g.fill();
      g.globalAlpha = 0.55; g.fillStyle = ink;
      g.beginPath(); g.moveTo(-60, H); g.quadraticCurveTo(420, H - 170, 900, H - 60); g.quadraticCurveTo(1060, H - 20, W + 60, H - 70); g.lineTo(W + 60, H); g.closePath(); g.fill();

      g.globalAlpha = 1;
      g.fillStyle = 'rgba(255,253,245,0.93)';
      roundRect(g, 70, 70, W - 140, H - 140, 26);
      g.fill();

      g.fillStyle = ink;
      g.font = '600 15px "Microsoft YaHei", sans-serif';
      g.fillText('晴 天 以 后 · 结 局', 118, 140);

      g.font = '600 58px "Songti SC", "SimSun", serif';
      g.fillText(e.title, 116, 224);

      g.fillStyle = 'rgba(90,118,116,1)';
      g.font = '17px "Microsoft YaHei", sans-serif';
      wrapText(g, e.body, 118, 288, W - 260, 34);

      let y = 288 + wrapText(g, e.body, 118, 288, W - 260, 34) + 26;
      if (extras.length) {
        g.fillStyle = 'rgba(79,145,135,1)';
        g.font = '15px "Microsoft YaHei", sans-serif';
        const t = extras.join('');
        g.fillText('— — —', 118, y);
        y += 30;
        g.fillStyle = 'rgba(90,118,116,1)';
        wrapText(g, t, 118, y, W - 260, 30);
      }

      const st = SP.engine.state;
      g.fillStyle = 'rgba(139,163,157,1)';
      g.font = '13px ui-monospace, monospace';
      g.fillText(
        `这个学期，认真做过 ${st.choices} 次选择。`,
        118, H - 118
      );
      g.fillText(new Date().toLocaleDateString('zh-CN'), W - 260, H - 118);

      const url = cv.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = `留一盏灯-${e.title}.png`;
      a.click();
      toast('结局卡已保存到下载目录');
    } catch (err) {
      toast('这个浏览器不支持导出图片。');
    }
  }

  function roundRect(g, x, y, w, hh, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + hh, r);
    g.arcTo(x + w, y + hh, x, y + hh, r);
    g.arcTo(x, y + hh, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function wrapText(g, text, x, y, maxW, lh) {
    const chars = String(text).split('');
    let line = '', lines = 0;
    for (const ch of chars) {
      const test = line + ch;
      if (g.measureText(test).width > maxW && line) {
        g.fillText(line, x, y + lines * lh);
        lines++;
        line = ch;
      } else line = test;
    }
    if (line) { g.fillText(line, x, y + lines * lh); lines++; }
    return lines * lh;
  }

  SP.ui = {
    toast, achievementPopup, paintBonds, paintProgress, syncModes,
    showChapterCard, openPanel, closePanel, isPanelOpen,
    showCover, openMenu, openLog, openSaves, openSettings, openNotebook,
    openGallery, openAchievements, openFlow, showEnding, exportEndingCard,
    head, btn,          // 漫游层（地图 / 任务手账）复用的面板骨架
    BOND_META,
  };
})(window);


</script>
<script data-part="engine.js">
/*!
 * 晴天以后 · v2  |  engine.js
 * 叙事引擎：状态机、打字机、场景调度、立绘、自动/快进、历史与存档。
 */
(function (global) {
  'use strict';
  const SP = global.SP;
  const { $, h, clear, clamp } = SP;
  const ST = SP.story;

  const SIDES = { man: 'right', yan: 'right', cheng: 'right', aunt: 'right', mom: 'right', teacher: 'right' };
  const SPEED = [2.6, 1.6, 1.0, 0.58, 0];        // 文字速度倍率，0 = 瞬显
  const AUTO_DELAY = [3800, 2600, 1600];

  const Engine = {
    state: null,
    chapter: null,
    busy: false,
    typing: null,
    fullText: '',
    visible: false,
    auto: false,
    skip: false,
    autoTimer: null,
    currentScene: null,
    currentChar: null,
    currentExpr: null,
    logOpen: false,
    ended: false,
  };

  /* ------------------------------- 状态管理 ------------------------------- */

  function init(loadedState) {
    Engine.state = loadedState || ST.fresh();
    Engine.ended = false;
    Engine.chapter = null;
    Engine.auto = false;
    Engine.skip = false;
  }

  function addBonds(delta) {
    if (!delta) return [];
    const up = [];
    for (const k in delta) {
      const before = Engine.state.bonds[k] || 0;
      Engine.state.bonds[k] = clamp(before + delta[k], 0, 10);
      if (Engine.state.bonds[k] > before) up.push(k);
    }
    if (up.length) {
      SP.ui.paintBonds(up);
      checkAchievements();
    }
    return up;
  }

  function pushHistory() {
    Engine.state.history.push({
      id: Engine.state.id,
      flags: Object.assign({}, Engine.state.flags),
      bonds: Object.assign({}, Engine.state.bonds),
      logLength: Engine.state.log.length,
      choices: Engine.state.choices,
      memories: (Engine.state.memories || []).slice(),
    });
    if (Engine.state.history.length > 240) Engine.state.history.shift();
  }

  /* ------------------------------ 世界分路 ------------------------------ */

  /**
   * 把世界（自由行动里做过的委托）推导出来的 flag 并进叙事状态。
   *
   * 漫游版的主线不再有选项：每一处分岔都读 flag，而 flag 是
   * 「这个月你把时间花在谁身上」写下的。所以每次渲染 / 求值 next /
   * 存档之前，都要先把世界那一半补上。
   *
   * 并进来之后不撤销 —— 存档回退能退回剧情，但做过的委托不会消失。
   */
  function syncWorldFlags() {
    if (!SP.game || !SP.game.derivedFlags || !Engine.state) return;
    const wf = SP.game.derivedFlags();
    if (!wf) return;
    if (!Engine.state.flags) Engine.state.flags = {};
    for (const k in wf) Engine.state.flags[k] = wf[k];
  }

  /* -------------------------------- 推进 --------------------------------- */

  function go(toId, opt = {}) {
    if (Engine.busy) return;
    const target = ST.NODES[toId];
    if (!target) return;
    SP.engine.stopAuto();
    pushHistory();
    Object.assign(Engine.state.flags, opt.set || {});
    if (opt.bond) addBonds(opt.bond);
    if (target.set) Object.assign(Engine.state.flags, target.set);
    if (target.bond) addBonds(target.bond);
    if (opt.label) {
      const here = ST.NODES[Engine.state.id];
      Engine.state.log.push({
        kind: 'choice',
        speaker: '我的选择',
        text: opt.label,
        place: (here && here.place) || '',
        t: Date.now(),
      });
      Engine.state.choices++;
      SP.storage.unlockAchievement('firstChoice') && SP.ui.achievementPopup('firstChoice');
      checkAchievements();
    }
    show(toId);
  }

  function advanceNext() {
    const node = ST.NODES[Engine.state.id];
    if (!node || node.ending) return;
    syncWorldFlags();
    let nextId = node.next;
    if (typeof nextId === 'function') nextId = nextId(Engine.state.flags);
    // 闸门节点：先交给自由行动，走到目标地点再继续主线
    if (nextId && SP.roam && SP.roam.shouldGate(Engine.state.id)) { SP.roam.enter(nextId); return; }
    if (nextId) go(nextId);
  }

  function pick(choice) {
    if (Engine.busy) return;
    if (choice.requires && !choice.requires(Engine.state.flags)) {
      SP.ui.toast(choice.requiresHint || '这个选项现在还不能选。');
      return;
    }
    if (!Engine.visible) { finishText(); return; }
    SP.audio.sfx('choice');
    go(choice.to, { set: choice.set, bond: choice.bond, label: choice.label });
  }

  function back() {
    if (Engine.busy) return;
    if (!Engine.state.history.length) { SP.ui.toast('已经是最开始的一段了。'); return; }
    SP.engine.stopAuto();
    const prev = Engine.state.history.pop();
    Engine.state.flags = prev.flags;
    Engine.state.bonds = prev.bonds || Engine.state.bonds;
    Engine.state.log = Engine.state.log.slice(0, prev.logLength);
    Engine.state.choices = prev.choices;
    Engine.state.memories = prev.memories || [];
    SP.storage.unlockAchievement('backtrack') && SP.ui.achievementPopup('backtrack');
    SP.ui.paintBonds();
    show(prev.id, { instant: false, record: false });
  }

  /* -------------------------------- 打字机 ------------------------------- */

  function speedFactor() {
    const s = SP.storage.getSettings().textSpeed;
    return SPEED[s] != null ? SPEED[s] : 1;
  }

  /* 把节点的分段文本摊平成一个可逐字显示的序列。
   * 每段一个 <span class="seg seg-<kind>">，打字机按「整串偏移」往里灌字，
   * 所以对白 / 旁白 / 心声各自成段、各自带样式，但读起来仍是一句话接一句。 */
  function setText(segs) {
    stopTyping();
    const list = (Array.isArray(segs) && segs.length) ? segs : [{ k: 'n', s: String(segs || '') }];
    Engine.segs = list;
    Engine.fullText = list.map((s) => s.s).join('');

    const line = $('#line');
    clear(line);
    const host = h('span.txt');
    const spans = list.map((sg) => {
      const el = document.createElement('span');
      el.className = 'seg seg-' + sg.k;
      if (sg.w) el.setAttribute('data-who', sg.w);
      host.appendChild(el);
      return el;
    });
    line.append(host, h('span.cursor'));
    Engine.visible = false;

    // 把「已显示 n 个字」摊到每一段上
    const paint = (n) => {
      let left = n;
      for (let i = 0; i < spans.length; i++) {
        const s = list[i].s;
        const take = left <= 0 ? 0 : Math.min(s.length, left);
        if (spans[i].textContent.length !== take) spans[i].textContent = take >= s.length ? s : s.slice(0, take);
        left -= s.length;
      }
    };
    Engine.paintText = paint;

    const factor = speedFactor();
    if (factor === 0 || SP.stage.reduced) {
      paint(Engine.fullText.length);
      finishText();
      return;
    }

    let i = 0;
    let acc = 0;
    let mark = null;              // 用 null 而不是 0 做哨兵：rAF 时间戳可能真的是 0
    const base = 26 * factor;
    const full = Engine.fullText;
    Engine.typing = requestAnimationFrame(function step(t) {
      if (mark === null) mark = t;
      const dt = t - mark;
      mark = t;
      acc += dt;
      while (acc > 0 && i < full.length) {
        const ch = full[i];
        const d = base * SP.typeDelay(ch) * 0.88;
        if (acc < d) break;
        acc -= d;
        i++;
        if (SP.storage.getSettings().typingSound && i % 6 === 0) SP.audio.sfx('hover');
      }
      paint(i);
      if (i >= full.length) { finishText(); return; }
      Engine.typing = requestAnimationFrame(step);
    });
  }

  function stopTyping() {
    if (Engine.typing) cancelAnimationFrame(Engine.typing);
    Engine.typing = null;
  }

  function finishText() {
    stopTyping();
    const line = $('#line');
    if (Engine.paintText) Engine.paintText(String(Engine.fullText || '').length);
    const cursor = line.querySelector('.cursor');
    if (cursor) cursor.remove();
    Engine.visible = true;
    const node = ST.NODES[Engine.state.id];
    const nextBtn = $('#nextBtn');
    const hint = $('#hint');
    if (node.choices) {
      nextBtn.classList.add('hidden');
      hint.textContent = '选择你想做的事';
      renderChoices(node.choices);
      if (Engine.skip) Engine.skip = false, SP.ui.syncModes();
    } else {
      nextBtn.classList.remove('hidden');
      hint.textContent = '空格 / 回车 / 点击继续';
      if (Engine.auto) scheduleAuto();
    }
    SP.engine.markRead();
  }

  /* -------------------------------- 选项 --------------------------------- */

  function renderChoices(list) {
    const box = $('#choices');
    clear(box);
    const flags = Engine.state.flags;
    list.forEach((c, i) => {
      const ok = !c.requires || c.requires(flags);
      const b = h(
        'button.choice',
        {
          type: 'button',
          data: { index: String(i + 1) },
          class: (c.secret ? 'secret ' : '') + (ok ? '' : 'locked'),
          'aria-disabled': ok ? null : 'true',
          onmouseenter: () => SP.audio.sfx('hover'),
          onclick: () => pick(c),
        },
        h('span', { text: c.label }),
        c.hint ? h('small', { text: ok ? c.hint : c.requiresHint || '条件未满足' }) : null
      );
      if (!ok) b.title = c.requiresHint || '条件未满足';
      box.append(b);
    });
    box.classList.remove('hidden');
    SP.ui.syncModes();
  }

  /* ------------------------------- 场景调度 ------------------------------ */

  function applyScene(node) {
    const scene = node.scene || Engine.currentScene || 'campus';
    if (SP.game) SP.game.track(scene);           // 地图上跟着故事显示“你在这里”
    const time = node.time || null;
    const weather = node.weather || null;
    const changedScene = scene !== Engine.currentScene;
    if (changedScene || time || weather) {
      SP.stage.setScene(scene, {
        time: time || lastTime,
        weather: weather || lastWeather,
        transition: node.transition || 'fade',
      });
      Engine.currentScene = scene;
    }
    if (time) lastTime = time;
    if (weather) lastWeather = weather;
    SP.audio.setMood(node.mood || 'calm');
    SP.audio.setScene(scene, weather || lastWeather);
    return changedScene;
  }
  let lastTime = 'day';
  let lastWeather = 'clear';

  function renderCharacter(node) {
    const box = $('#characters');
    const key = node.person;
    if (!key) {
      Array.from(box.children).forEach((el) => {
        if (!el.classList.contains('out')) {
          el.classList.add('out');
          setTimeout(() => el.remove(), 600);
        }
      });
      Engine.currentChar = null;
      return;
    }
    const expr = node.expr || 'calm';
    if (Engine.currentChar === key && box.querySelector('.char:not(.out) .ch-svg')) {
      if (Engine.currentExpr !== expr) {
        box.querySelector('.char:not(.out) .ch-svg').outerHTML = SP.character.build(key, expr);
        Engine.currentExpr = expr;
      }
      return;
    }
    Array.from(box.children).forEach((el) => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 600);
    });
    const el = h('div.char.enter', {
      data: { char: key, side: SIDES[key] || 'right' },
      html: SP.character.build(key, expr),
    });
    box.append(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));
    Engine.currentChar = key;
    Engine.currentExpr = expr;
  }

  /* --------------------------------- 显示 -------------------------------- */

  function chapterLabelFor(node) {
    if (node.chapter) return node.chapter;
    if (Engine.chapter) return Engine.chapter;
    // 兜底：按进度值反查所属章节
    const p = node.p || 0;
    const R = [[0, 21], [24, 61], [65, 90], [94, 100]];
    for (let i = R.length - 1; i >= 0; i--) if (p >= R[i][0]) return (ST.CHAPTERS[i] || {}).name || '';
    return (ST.CHAPTERS[0] || {}).name || '';
  }

  function show(id, opt = {}) {
    const node = ST.NODES[id];
    if (!node) return;
    if (SP.roam) SP.roam.hide();      // 回到故事叙述时，收起自由行动层
    stopTyping();
    stopAuto();
    Engine.visible = false;
    Engine.state.id = id;
    syncWorldFlags();

    if (node.ending) { Engine.state.flags.ending = ST.resolveEnding(Engine.state.flags); Engine.ended = true; SP.ui.showEnding(); saveAuto(); return; }

    $('#overlay').classList.add('hidden');
    Engine.ended = false;
    $('#dialogue').classList.remove('hidden');

    const chapterChanged = node.chapter && node.chapter !== Engine.chapter;
    if (node.chapter) Engine.chapter = node.chapter;

    const paint = () => {
      const sceneChanged = applyScene(node);
      const segs = ST.segments(node, Engine.state.flags);
      const hasLine = segs.some((s) => s.k === 'd');
      const hasInner = segs.some((s) => s.k === 'i');

      $('#chapterChip').textContent = chapterLabelFor(node);
      $('#placeChip').textContent = node.place || '';
      $('#speaker').innerHTML = '';
      // 名牌只反映「这一节的主声音是谁」：
      //   角色节点 → 那个角色的名字
      //   我        → 我说出口时是「我」，只在心里想时是「心里」
      //   旁白      → 不挂牌。旁白一挂牌子就变成有人在念，
      //              而它本该退到故事后面当一层空气。
      // 所以旁白里引用的别人说的话，也不会把名字挂到框顶上。
      if (node.person) {
        $('#speaker').append(h('span', { text: node.speaker }));
        const label = (SP.character.PRESETS[node.person] || {}).label;
        if (label && label !== node.speaker) $('#speaker').append(h('span.badge', { text: label }));
      } else if (node.speaker === '我') {
        if (hasLine) $('#speaker').append(h('span', { text: '我' }));
        else $('#speaker').append(h('span.inner-tag', { text: '心里' }));
      }
      renderCharacter(node);
      $('#choices').classList.add('hidden');
      $('#nextBtn').classList.add('hidden');
      $('#hint').textContent = '点击文字可立即显示整段';
      SP.ui.paintProgress(node.p || 0);

      setText(segs);
      const text = Engine.fullText;
      Engine.state.memories = Engine.state.memories || [];
      if (node.memory && opt.record !== false && !Engine.state.memories.includes(node.memory)) Engine.state.memories.push(node.memory);
      const pocket = $('#pocketBtn');
      // 故事记忆也进口袋，角标一起涨
      if (pocket) {
        const n = (SP.game ? SP.game.ownedItems().length : 0);
        if (n > 0) pocket.dataset.badge = String(n); else delete pocket.dataset.badge;
      }
      if (node.voice && SP.storage.getSettings().voiceCue && !Engine.skip) {
        SP.audio.voice(node.person || null, { text });
      }
      if (node.sfx && !Engine.skip) SP.audio.sfx(node.sfx);

      if (opt.record !== false) {
        Engine.state.log.push({
          kind: hasLine ? (node.speaker === '我' ? 'mine' : 'say') : (hasInner ? 'mine' : 'narr'),
          speaker: hasLine ? (node.speaker || '旁白') : (hasInner ? '我' : '旁白'),
          text,
          place: node.place || '',
          chapter: node.chapter || Engine.chapter,
          t: Date.now(),
        });
        if (Engine.state.log.length > 400) Engine.state.log.shift();
      }
      saveAuto();
      if (SP.storage.getSettings().showBonds) SP.ui.paintBonds();
    };

    if (opt.instant) {
      paint();
      Engine.busy = false;
      return;
    }

    Engine.busy = true;
    $('#dialogue').classList.add('changing');
    $('#choices').classList.add('hidden');

    const run = () => {
      setTimeout(() => {
        try { paint(); } finally {
          $('#dialogue').classList.remove('changing');
          Engine.busy = false;
        }
      }, 170);
    };

    if (chapterChanged && !Engine.skip && !opt.noCard) {
      const ch = ST.CHAPTERS.find((c) => c.name === node.chapter);
      if (ch) {
        applyScene(node);
        SP.audio.sfx('whoosh');
        SP.ui.showChapterCard(ch, () => run());
        return;
      }
    }
    run();
  }

  /* ------------------------------ 自动 / 快进 ----------------------------- */

  function scheduleAuto() {
    stopAuto();
    if (!Engine.auto) return;
    const d = AUTO_DELAY[SP.storage.getSettings().autoSpeed] || 1700;
    Engine.autoTimer = setTimeout(() => {
      const node = ST.NODES[Engine.state.id];
      if (!node || node.choices || node.ending) { Engine.auto = false; SP.ui.syncModes(); return; }
      advanceNext();
    }, d);
  }

  function stopAuto() {
    clearTimeout(Engine.autoTimer);
    Engine.autoTimer = null;
  }

  function toggleAuto() {
    Engine.auto = !Engine.auto;
    if (Engine.auto) {
      Engine.skip = false;
      if (Engine.visible) scheduleAuto();
    } else stopAuto();
    SP.ui.syncModes();
    SP.ui.toast(Engine.auto ? '自动播放：开' : '自动播放：关');
  }

  function toggleSkip() {
    Engine.skip = !Engine.skip;
    if (Engine.skip) {
      Engine.auto = false;
      stopAuto();
      SP.ui.toast('快进已读：开');
      fastForward();
    } else {
      SP.ui.toast('快进已读：关');
    }
    SP.ui.syncModes();
  }

  function fastForward() {
    if (!Engine.skip) return;
    if (Engine.busy) { setTimeout(fastForward, 100); return; }
    const node = ST.NODES[Engine.state.id];
    if (!node || node.ending || node.choices) { Engine.skip = false; SP.ui.syncModes(); return; }
    syncWorldFlags();
    const nextId = typeof node.next === 'function' ? node.next(Engine.state.flags) : node.next;
    if (!nextId) { Engine.skip = false; SP.ui.syncModes(); return; }
    const read = SP.storage.getProgress().readNodes.includes(nextId);
    if (!read) { Engine.skip = false; SP.ui.syncModes(); SP.ui.toast('遇到未读内容，已停止快进。'); return; }
    go(nextId);
    if (Engine.skip) setTimeout(fastForward, 260);
  }

  /* ------------------------------- 其它动作 ------------------------------ */

  function next() {
    if (Engine.busy) return;
    if (SP.roam && SP.roam.active()) return;     // 自由行动中不推进剧情
    if (!$('#overlay').classList.contains('hidden')) return;
    if (!Engine.visible) { finishText(); return; }
    const node = ST.NODES[Engine.state.id];
    if (!node || node.choices || node.ending) return;
    advanceNext();
  }

  function markRead() {
    const ids = [Engine.state.id];
    SP.storage.markRead(ids);
  }

  function saveAuto() {
    const s = SP.storage.getSettings();
    if (!s.autoSave) return;
    syncWorldFlags();
    const node = ST.NODES[Engine.state.id];
    const text = typeof node.text === 'function' ? node.text(Engine.state.flags) : node.text || '';
    SP.storage.writeSlot('auto', {
      state: Engine.state, // storage.writeSlot 在持久化边界统一复制快照
      roam: SP.roam ? SP.roam.snapshot() : null,
      chapter: node.chapter || Engine.chapter,
      place: node.place,
      scene: node.scene || Engine.currentScene,
      time: node.time || lastTime,
      weather: node.weather || lastWeather,
      p: node.p || 0,
      speaker: node.speaker,
      preview: String(text).slice(0, 46),
      choices: Engine.state.choices,
      bonds: Engine.state.bonds,
    });
  }

  function saveTo(id) {
    const node = ST.NODES[Engine.state.id];
    const text = typeof node.text === 'function' ? node.text(Engine.state.flags) : node.text || '';
    SP.storage.writeSlot(id, {
      state: Engine.state, // storage.writeSlot 在持久化边界统一复制快照
      roam: SP.roam ? SP.roam.snapshot() : null,
      chapter: node.chapter || Engine.chapter,
      place: node.place,
      scene: node.scene || Engine.currentScene,
      time: node.time || lastTime,
      weather: node.weather || lastWeather,
      p: node.p || 0,
      speaker: node.speaker,
      preview: String(text).slice(0, 46),
      choices: Engine.state.choices,
      bonds: Engine.state.bonds,
    });
    SP.audio.sfx('click');
  }

  function loadFrom(id) {
    const slot = SP.storage.readSlot(id);
    if (!slot) return false;
    if (!slot.state || !ST.NODES[slot.state.id]) { SP.ui.toast('这份存档不属于《留一盏灯》。'); return false; }
    const savedLoc = slot.state.world && slot.state.world.loc;
    if (SP.roam) SP.roam.reset();
    Engine.auto = false; Engine.skip = false;
    Engine.state = slot.state;
    Engine.state.bonds = Engine.state.bonds || { man: 0, yan: 0, family: 0, self: 0 };
    Engine.state.log = Engine.state.log || [];
    Engine.state.history = Engine.state.history || [];
    Engine.state.memories = Engine.state.memories || [];
    Engine.chapter = null;
    const node = ST.NODES[Engine.state.id];
    Engine.currentScene = null;
    Engine.currentChar = null;
    if (node && (node.time || node.weather)) {
      lastTime = node.time || lastTime;
      lastWeather = node.weather || lastWeather;
    }
    SP.ui.paintBonds();
    show(Engine.state.id, { instant: true, record: false });
    if (slot.roam && SP.roam && SP.game.windowOf(Engine.state.id) === slot.roam.windowId && ST.NODES[slot.roam.next]) {
      if (savedLoc && SP.game.LOCS[savedLoc]) Engine.state.world.loc = savedLoc;
      SP.roam.enter(slot.roam.next, true);
    }
    SP.ui.syncModes();
    return true;
  }

  function restart() {
    if (SP.roam) SP.roam.reset();
    Engine.state = ST.fresh();
    Engine.chapter = null;
    Engine.currentScene = null;
    Engine.currentChar = null;
    Engine.skip = false;
    Engine.auto = false;
    Engine.ended = false;
    lastTime = 'afternoon';
    lastWeather = 'fair';
    $('#overlay').classList.add('hidden');
    SP.ui.paintBonds();
    show('arrival', { instant: true });
    SP.storage.unlockAchievement('begin') && SP.ui.achievementPopup('begin');
  }

  /* -------------------------------- 成就 --------------------------------- */

  function checkAchievements() {
    syncWorldFlags();
    const p = SP.storage.getProgress();
    const f = Engine.state.flags;
    const b = Engine.state.bonds;
    const give = (id) => {
      if (SP.storage.unlockAchievement(id)) {
        SP.ui.achievementPopup(id);
        SP.audio.sfx('unlock');
      }
    };
    if (f.night === 'stop') give('rainyWalk');
    if (f.watched) give('nightOwl');
    if (b && Object.values(b).some((v) => v >= 6)) give('bondMax');
    if (SP.audio.played > 300) give('listener');
    const n = p.endings.length;
    if (n >= 3) give('end3');
    if (n >= Object.keys(ST.ENDINGS).length) give('endAll');
  }

  /** 供外部（图鉴 / 结局）调用 */
  function currentChapterIndex() {
    const node = ST.NODES[Engine.state.id] || {};
    const i = ST.CHAPTERS.findIndex((c) => c.name === (node.chapter || Engine.chapter));
    return i < 0 ? 0 : i;
  }

  SP.engine = Object.assign(Engine, {
    init, show, go, next, back, pick, restart,
    toggleAuto, toggleSkip, stopAuto, fastForward,
    saveTo, loadFrom, saveAuto, checkAchievements, currentChapterIndex,
    addBonds, renderChoices, finishText, stopTyping, markRead, syncWorldFlags,
    SIDES,
  });
  // Object.assign 会把上面的 getter 求值成静态快照；这里补成实时访问器，
  // 自由行动旅行时要拿到故事当前的时段与天气。
  Object.defineProperty(SP.engine, 'lastTime', { get: () => lastTime, configurable: true });
  Object.defineProperty(SP.engine, 'lastWeather', { get: () => lastWeather, configurable: true });
})(window);


</script>
<script data-part="main.js">
/*!
 * 晴天以后 · v2  |  main.js
 * 启动与事件绑定：把舞台、音频、存储、引擎、界面串起来，并接管键盘与手势。
 */
(function (global) {
  'use strict';
  const SP = global.SP;
  const { $ } = SP;
  const SS = SP.storage;

  function applySettings() {
    const s = SS.getSettings();
    document.documentElement.dataset.fontsize = String(s.fontSize);
    document.documentElement.dataset.motion = s.reduceMotion ? 'off' : 'on';
    document.documentElement.dataset.ui = s.nightUI ? 'night' : 'light';
    SP.audio.tts = !!s.tts;
    SP.audio.setVolume('master', s.volMaster);
    SP.audio.setVolume('music', s.volMusic);
    SP.audio.setVolume('amb', s.volAmb);
    SP.audio.setVolume('sfx', s.volSfx);
  }

  function boot() {
    applySettings();

    SP.stage.init($('#game'));
    SP.engine.init(null);
    SP.ui.paintBonds();
    SP.ui.syncModes();

    // 首屏：先摆一个安静的黄昏校门口当背景
    SP.stage.setScene('campus', { time: 'dusk', weather: 'fair', instant: true });
    SP.palette.applyTheme(SP.stage.el, 'campus', 'dusk', 'fair');

    SP.ui.showCover();
    wireUI();
    wireKeyboard();
    wireFirstGesture();
  }

  /* ------------------------------- 按钮绑定 ------------------------------ */

  function wireUI() {
    $('#pocketBtn').addEventListener('click', () => { if (!SP.ui.isPanelOpen()) SP.ui.openNotebook(); });
    $('#backBtn').addEventListener('click', () => {
      if (SP.ui.isPanelOpen()) return;
      SP.engine.back();
    });
    $('#logBtn').addEventListener('click', () => { if (!SP.ui.isPanelOpen()) SP.ui.openLog(); });
    $('#autoBtn').addEventListener('click', () => { if (!SP.ui.isPanelOpen()) SP.engine.toggleAuto(); });
    $('#skipBtn').addEventListener('click', () => { if (!SP.ui.isPanelOpen()) SP.engine.toggleSkip(); });
    $('#saveBtn').addEventListener('click', () => { if (!SP.ui.isPanelOpen()) SP.ui.openSaves('save'); });
    $('#menuBtn').addEventListener('click', () => { if (!SP.ui.isPanelOpen()) SP.ui.openMenu(); });

    // 漫游层：地图、任务手账、继续主线
    const openMap = () => { if (!SP.ui.isPanelOpen()) SP.roam.openMap(); };
    const openJournal = () => { if (!SP.ui.isPanelOpen()) SP.roam.openJournal(); };
    $('#mapBtn').addEventListener('click', openMap);
    $('#questBtn').addEventListener('click', openJournal);
    $('#roamMapBtn').addEventListener('click', openMap);
    $('#roamJournalBtn').addEventListener('click', openJournal);
    $('#roamGoBtn').addEventListener('click', () => { if (!SP.ui.isPanelOpen()) SP.roam.continueMain(); });

    $('#musicBtn').addEventListener('click', () => {
      const ok = SP.audio.toggle();
      if (ok === false) {
        SP.ui.toast('这个浏览器不支持 WebAudio。');
        return;
      }
      SS.saveSettings({ soundOn: SP.audio.enabled });
      SP.ui.syncModes();
      SP.ui.toast(SP.audio.enabled ? '音乐与音效已开启' : '已静音');
    });

    $('#nextBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      SP.engine.next();
    });

    $('#dialogue').addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      if (SP.ui.isPanelOpen()) return;
      SP.engine.next();
    });

    // 面板遮罩：点击空白处关闭（封面与结局除外）
    $('#overlay').addEventListener('click', (e) => {
      if (e.target.id !== 'overlay') return;
      const mode = $('#overlay').dataset.mode;
      if (mode === 'cover' || mode === 'ending') return;
      SP.ui.closePanel();
    });
  }

  /* ------------------------------- 键盘绑定 ------------------------------ */

  function wireKeyboard() {
    let ctrlSkip = false;

    document.addEventListener('keydown', (e) => {
      const panelOpen = SP.ui.isPanelOpen();

      if (e.key === 'Escape') {
        const mode = $('#overlay').dataset.mode;
        if (panelOpen) {
          if (mode === 'cover' || mode === 'ending') return;
          SP.ui.closePanel();
        } else {
          SP.ui.openMenu();
        }
        e.preventDefault();
        return;
      }

      if (panelOpen) {
        // 面板内的 Tab 循环由浏览器处理，这里只屏蔽会误触故事推进的按键
        return;
      }

      if (e.ctrlKey && !ctrlSkip && !e.shiftKey && !e.altKey) {
        ctrlSkip = true;
        if (!SP.engine.skip) SP.engine.toggleSkip();
        return;
      }

      if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;

      switch (e.key) {
        case ' ':
        case 'Enter':
          e.preventDefault();
          SP.engine.next();
          break;
        case 'Backspace':
          e.preventDefault();
          SP.engine.back();
          break;
        case 'ArrowDown':
        case 'ArrowUp':
          break;
        case 'a': case 'A':
          SP.engine.toggleAuto();
          break;
        case 'l': case 'L':
          SP.ui.openLog();
          break;
        case 's': case 'S':
          SP.ui.openSaves('save');
          break;
        case 'g': case 'G':
          SP.ui.openGallery();
          break;
        case 'm': case 'M':
          SP.roam.openMap();
          break;
        case 'j': case 'J':
          SP.roam.openJournal();
          break;
        case 'f': case 'F':
          SP.ui.openFlow();
          break;
        case 't': case 'T':
          SP.ui.openSettings();
          break;
        case 'h': case 'H':
          SP.audio.sfx('click');
          SP.ui.toast('Space 继续 · Ctrl 快进已读 · Esc 菜单 · L 记录 · S 存档 · M 地图 · J 任务', 4200);
          break;
        case '1': case '2': case '3': case '4': {
          const idx = Number(e.key) - 1;
          const btns = document.querySelectorAll('#choices .choice');
          if (btns[idx]) btns[idx].click();
          break;
        }
        default:
          break;
      }
    });

    document.addEventListener('keyup', (e) => {
      if ((e.key === 'Control' || e.key === 'Meta') && ctrlSkip) {
        ctrlSkip = false;
        if (SP.engine.skip) SP.engine.toggleSkip();
      }
    });

    // 切到后台时暂停自动播放，回来再继续
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) SP.engine.stopAuto();
      else if (SP.engine.auto) SP.engine.toggleAuto();
    });

    window.addEventListener('blur', () => {
      if (ctrlSkip && SP.engine.skip) SP.engine.toggleSkip();
      ctrlSkip = false;
    });
  }

  /* ------------------------ 首次交互解锁音频（自动播放策略） ------------------------ */

  function wireFirstGesture() {
    const unlock = () => {
      const s = SS.getSettings();
      if (s.soundOn && !SP.audio.enabled) {
        SP.audio.enable(true);
        SP.ui.syncModes();
      }
      window.removeEventListener('pointerdown', unlock);
      window.removeEventListener('keydown', unlock);
    };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);
    // 恢复按钮文案
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);


</script>
</body>
