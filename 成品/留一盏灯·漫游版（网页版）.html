<body>
<div class="app">
  <main class="game" id="game" aria-label="晴天以后，校园视觉小说">

    <!-- 顶栏 -->
    <header class="hud">
      <div class="chips">
        <div class="chip chapter" id="chapterChip">第一章 · 九月</div>
        <div class="chip place" id="placeChip">校门口</div>
      </div>
      <div class="toolbar" role="toolbar" aria-label="操作">
        <div class="tb-group">
          <button class="tb ic" id="backBtn" type="button" aria-label="返回上一段" title="返回上一段（Backspace）">↶</button>
          <button class="tb ic" id="logBtn" type="button" aria-label="故事记录" title="故事记录（L）">☰</button>
          <button class="tb ic" id="pocketBtn" type="button" aria-label="口袋" title="翻看故事中收起的纸片">▤</button>
          <button class="tb ic" id="mapBtn" type="button" aria-label="校园地图" title="校园地图（M）">◈</button>
          <button class="tb ic" id="questBtn" type="button" aria-label="任务手账" title="任务手账（J）">✦</button>
        </div>
        <div class="tb-group">
          <button class="tb sw" id="autoBtn" type="button" aria-pressed="false" aria-label="自动播放" title="自动播放（A）"><i></i>自动</button>
          <button class="tb sw" id="skipBtn" type="button" aria-pressed="false" aria-label="快进" title="按住 Ctrl 可快进已读"><i></i>快进</button>
        </div>
        <div class="tb-group">
          <button class="tb sw" id="musicBtn" type="button" aria-pressed="false" aria-label="声音" title="音乐、环境音与语气声（M）"><i></i>声音</button>
          <button class="tb ic" id="saveBtn" type="button" aria-label="存档" title="存档（S）">🖫</button>
          <button class="tb ic" id="menuBtn" type="button" aria-label="菜单" title="菜单（Esc）">≡</button>
        </div>
      </div>
    </header>

    <!-- 羁绊条 -->
    <aside class="bonds hidden" id="bonds" aria-label="羁绊值"></aside>

    <!-- 人物立绘 -->
    <div class="characters" id="characters" aria-hidden="true"></div>

    <!-- 自由行动层：场景人物标记、看一看、漫游 HUD、漫游对话 -->
    <div class="roam-layer hidden" id="roamLayer">
      <div class="npc-layer" id="npcLayer" aria-label="这里的人"></div>
      <button class="look-spot hidden" id="lookSpot" type="button">✦ 看看这里</button>
      <div class="roam-hud" id="roamHud">
        <div class="roam-obj">
          <b>当前目标</b>
          <span id="roamObjText">—</span>
          <em id="roamQuestCount">没有进行中的委托</em>
        </div>
        <div class="roam-actions">
          <button class="roam-btn ico" id="roamMapBtn" type="button" title="校园地图（M）"><span class="g">◈</span>地图</button>
          <button class="roam-btn ico" id="roamJournalBtn" type="button" title="任务手账（J）"><span class="g">✦</span>任务</button>
          <button class="roam-btn primary go" id="roamGoBtn" type="button">继续主线 →</button>
        </div>
      </div>
      <div class="roam-dialog hidden" id="roamDialog" aria-live="polite"></div>
    </div>

    <!-- 选项 -->
    <div class="choices hidden" id="choices" role="group" aria-label="故事选项"></div>

    <!-- 对话框 -->
    <section class="dialogue" id="dialogue" aria-live="polite" tabindex="0">
      <div class="speaker" id="speaker"></div>
      <div class="line scroll" id="line"></div>
      <div class="dialogue-foot">
        <span class="hint-text" id="hint">点击文字可继续</span>
        <button class="nextLine" id="nextBtn" type="button">继续 <i>↘</i></button>
      </div>
    </section>

    <!-- 进度条 -->
    <div class="progress" id="progressBar" aria-hidden="true"></div>

    <!-- 章节卡 -->
    <div class="chapter-card" id="chapterCard" aria-hidden="true"></div>

    <!-- 面板遮罩 -->
    <div class="overlay hidden" id="overlay" role="dialog" aria-modal="true">
      <div class="panel" id="panel"></div>
    </div>

    <!-- 提示 -->
    <div class="toast-wrap" id="toasts" aria-live="polite"></div>
    <div class="ach-pop" id="achPop" aria-live="polite"></div>
  </main>
</div>

<script data-part="util.js">

 * 晴天以后 · v2  |  util.js
 * 基础工具层：DOM、颜色运算、动画、存储、数学。
 * 无依赖，挂载到 window.SP。

  'use strict';
  const SP = (global.SP = global.SP || {});

  /* ---------------------------------- DOM --------------------------------- */

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  /** 创建元素：h('div.cls#id', {attr}, ...children) */
  function h(spec, attrs, ...children) {
    const m = /^([a-z0-9]+)?(.*)$/i.exec(spec);

    const idm = /#([\w-]+)/.exec(m[2] || '');
    if (idm) el.id = idm[1];
    const clsm = (m[2] || '').match(/\.([\w-]+)/g);
    if (clsm) el.className = clsm.map((s) => s.slice(1)).join(' ');

      children.unshift(attrs);
      attrs = null;
    }

        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);

  function clamp(v, a, b) {

  /** 确定性伪随机（同一个 seed 永远得到同一串数） */

    vars['--sun-y'] = (t.sun.y * 100).toFixed(1) + '%';
    vars['--sun-r'] = t.sun.r + 'px';
    vars['--sun-c'] = mix(t.sun.c, t.key, t.keyA * 0.5);
    vars['--sun-a'] = (t.sun.a * (w.rain > 0.5 ? 0.35 : 1)).toFixed(2);
    vars['--star-a'] = (t.star * (1 - Math.min(1, w.rain)) * (1 - Math.min(1, (w.fogMul - 1) / 2.5))).toFixed(2);
    vars['--moon-a'] = t.sun.kind === 'moon' ? 1 : 0;
    vars['--sun-op'] = t.sun.kind === 'moon' ? 0 : 1;

    // 氛围叠加
    vars['--amb-c'] = t.key;
    vars['--amb-o'] = (t.keyA * 0.9 + w.veil).toFixed(3);
    vars['--cloud-a'] = (0.5 * w.cloud).toFixed(2);
    vars['--glow-a'] = (t.glow * (w.rain > 0.5 ? 0.3 : 1)).toFixed(2);

    vars['--ui-tint'] = sky[1];
    vars['--lamp-a'] = ((1 - clamp((amb - 0.4) / 0.6, 0, 1)) * 0.9 + 0.1).toFixed(2);

    return vars;
  }

    const vars = theme(sceneKey, timeKey, weatherKey);

  function timeTween(from, to, k) {

  SP.SCENES = SCENES;
})(window);

  /** 长椅 */
  function bench(x, y, s) {    return (
      `<g><rect x="${n(x)}" y="${n(y)}" width="${n(120 * s)}" height="${n(9 * s)}" rx="3" fill="var(--c-wood)"/>` +
      `<rect x="${n(x)}" y="${n(y - 22 * s)}" width="${n(120 * s)}" height="${n(7 * s)}" rx="3" fill="var(--c-wood)"/>` +
      `<rect x="${n(x + 8 * s)}" y="${n(y + 9 * s)}" width="${n(7 * s)}" height="${n(26 * s)}" fill="var(--c-metal)"/>` +
      `<rect x="${n(x + 105 * s)}" y="${n(y + 9 * s)}" width="${n(7 * s)}" height="${n(26 * s)}" fill="var(--c-metal)"/></g>`
    );
  }

  /** 路灯：灯头夜里会亮 */
  function lamp(x, y, s, seed = 3) {
    const r = rng(seed);
    const hh = 250 * s;
    return (
      `<g><rect x="${n(x)}" y="${n(y - hh)}" width="${n(9 * s)}" height="${n(hh)}" fill="var(--c-metal)"/>` +
      `<path d="M ${n(x - 14 * s)} ${n(y - hh)} q ${n(18 * s)} ${n(-26 * s)} ${n(36 * s)} 0 z" fill="var(--c-metal)"/>` +
      `<circle cx="${n(x + 4 * s)}" cy="${n(y - hh + 8 * s)}" r="${n(13 * s)}" fill="var(--c-lamp)" opacity="var(--lamp-a)"/>` +
      `<circle cx="${n(x + 4 * s)}" cy="${n(y - hh + 8 * s)}" r="${n(46 * s)}" fill="var(--c-lamp)" opacity="${(0.16 * (0.4 + r() * 0.2)).toFixed(2)}" class="lamp-halo"/></g>`
    );
  }

  /* ------------------------------ 室内通用件 ------------------------------ */

  /** 窗户（外面透出天空色，夜里透出暖灯） */
  function window4(x, y, w, hgt, panesX = 2, panesY = 2, sill = true) {
    let s = `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(hgt)}" rx="4" fill="var(--c-glass)"/>`;
    s += `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(hgt)}" rx="4" fill="var(--c-warm)" opacity="${'calc(var(--lamp-a) * .35)'}" class="win-warm"/>`;
    for (let i = 1; i < panesX; i++) s += `<rect x="${n(x + (w * i) / panesX - 3)}" y="${n(y)}" width="6" height="${n(hgt)}" fill="var(--c-wall)"/>`;
    for (let j = 1; j < panesY; j++) s += `<rect x="${n(x)}" y="${n(y + (hgt * j) / panesY - 3)}" width="${n(w)}" height="6" fill="var(--c-wall)"/>`;
    s += `<rect x="${n(x - 10)}" y="${n(y - 10)}" width="${n(w + 20)}" height="${n(hgt + 20)}" rx="6" fill="none" stroke="var(--c-wall)" stroke-width="14"/>`;
    if (sill) s += `<rect x="${n(x - 22)}" y="${n(y + hgt + 8)}" width="${n(w + 44)}" height="14" rx="4" fill="var(--c-trim)"/>`;
    return s;
  }

  /** 课桌（俯视微透视） */
  function desk(x, y, w, s = 1) {
    const d = w * 0.34;
    return (
      `<g><path d="${poly([[x, y], [x + w, y], [x + w + d, y + d * 0.72], [x - d, y + d * 0.72]])}" fill="var(--c-wood)"/>` +
      `<rect x="${n(x + 8 * s)}" y="${n(y + d * 0.72)}" width="${n(w * 0.86)}" height="${n(d * 0.5)}" fill="var(--c-wall2)" opacity=".9"/></g>`
    );
  }

  function chair(x, y, s = 1) {
    return `<g opacity=".95"><rect x="${n(x)}" y="${n(y)}" width="${n(46 * s)}" height="${n(9 * s)}" rx="3" fill="var(--c-metal)"/>` +
      `<rect x="${n(x)}" y="${n(y + 9 * s)}" width="${n(46 * s)}" height="${n(38 * s)}" rx="4" fill="var(--c-metal)" opacity=".55"/>` +
      `<rect x="${n(x + 3 * s)}" y="${n(y + 47 * s)}" width="${n(40 * s)}" height="${n(30 * s)}" rx="3" fill="var(--c-metal)" opacity=".35"/></g>`;
  }

  /** 课桌 + 椅子一组，带落地阴影，读起来更像家具 */
  function deskPair(x, y, w, s = 1, seed = 1) {
    const d = w * 0.3;
    return (
      `<g class="obj-desk">` +
      `<ellipse cx="${n(x + w / 2)}" cy="${n(y + d * 1.5)}" rx="${n(w * 0.6)}" ry="${n(d * 0.42)}" fill="var(--c-ink)" opacity=".13"/>` +
      `<path d="${poly([[x, y], [x + w, y], [x + w + d, y + d * 0.68], [x - d, y + d * 0.68]])}" fill="var(--c-wood)"/>` +
      `<path d="${poly([[x - d, y + d * 0.68], [x + w + d, y + d * 0.68], [x + w + d, y + d * 1.08], [x - d, y + d * 1.08]])}" fill="var(--c-ink)" opacity=".45"/>` +
      `<path d="${poly([[x - d, y + d * 0.68], [x + w + d, y + d * 0.68], [x + w + d, y + d * 1.08], [x - d, y + d * 1.08]])}" fill="var(--c-wood)" opacity=".18"/>` +
      `<path d="${poly([[x, y], [x + w, y], [x + w + d, y + d * 0.68], [x - d, y + d * 0.68]])}" fill="#ffffff" opacity=".16"/>` +
      `<path d="M ${n(x + 14)} ${n(y + d * 0.7)} l 0 ${n(d * 0.42)} M ${n(x + w - 14)} ${n(y + d * 0.7)} l 0 ${n(d * 0.44)}" stroke="var(--c-ink)" stroke-width="3" opacity=".25"/>` +
      `<rect x="${n(x + w * 0.1)}" y="${n(y + d * 0.76)}" width="${n(w * 0.8)}" height="${n(d * 0.2)}" rx="3" fill="var(--c-wall2)" opacity=".45"/>` +
      chair(x + w * 0.18, y - 60 * s, s) +
      `</g>`
    );
  }

  /** 挂钟 */
  function clock(cx, cy, r = 30) {
    return (
      `<g><circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r)}" fill="var(--c-wall)" stroke="var(--c-trim)" stroke-width="5"/>` +
      `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r * 0.82)}" fill="#f7f4e8" opacity=".8"/>` +
      `<path d="M ${n(cx)} ${n(cy)} L ${n(cx)} ${n(cy - r * 0.5)} M ${n(cx)} ${n(cy)} L ${n(cx + r * 0.42)} ${n(cy + r * 0.2)}" stroke="var(--c-ink)" stroke-width="3.4" stroke-linecap="round"/>` +
      `<circle cx="${n(cx)}" cy="${n(cy)}" r="3" fill="var(--c-ink)"/></g>`
    );
  }

  /** 室内吸顶灯（条灯） */
  function ceilingLight(x, y, w, seed = 1) {
    return (
      `<g class="ceiling-light"><rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="14" rx="6" fill="var(--c-wall2)"/>` +
      `<rect x="${n(x + 8)}" y="${n(y + 2)}" width="${n(w - 16)}" height="9" rx="4" fill="var(--c-lamp)" opacity="var(--lamp-a)"/>` +
      `<ellipse cx="${n(x + w / 2)}" cy="${n(y + 40)}" rx="${n(w * 0.62)}" ry="${n(140)}" fill="url(#soft-light)" opacity="calc(var(--lamp-a) * .5)"/></g>`
    );
  }

  /** 灯泡串 / 挂灯 */
  function pendant(x, y, drop, seed = 1) {
    return (
      `<g><rect x="${n(x)}" y="0" width="3.5" height="${n(drop)}" fill="var(--c-ink)" opacity=".55"/>` +
      `<circle cx="${n(x + 1.7)}" cy="${n(drop + 12)}" r="13" fill="var(--c-lamp)" opacity="var(--lamp-a)"/>` +
      `<ellipse cx="${n(x + 1.7)}" cy="${n(drop + 60)}" rx="110" ry="80" fill="url(#soft-light)" opacity="var(--lamp-a)"/></g>`
    );
  }

  /** 书脊墙（书架） */
  function bookshelf(x, y, w, hgt, seed, rows = 5) {
    const r = rng(seed);
    const bookColors = ['#c47a6a', '#7d9e8c', '#c9a濃'.replace('濃', 'a06e'), '#8d93b5', '#b08fa8', '#9fae7f', '#d0b283'];
    let s = `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(hgt)}" fill="var(--c-wood)"/>`;
    const rowH = hgt / rows;
    for (let j = 0; j < rows; j++) {
      const ry = y + j * rowH;
      s += `<rect x="${n(x + w * 0.04)}" y="${n(ry + rowH * 0.12)}" width="${n(w * 0.92)}" height="${n(rowH * 0.74)}" fill="var(--c-ink)" opacity=".45"/>`;
      let bx = x + w * 0.06;
      while (bx < x + w * 0.94) {
        const bw = 6 + r() * 11, bh = rowH * (0.45 + r() * 0.28);
        const c = bookColors[Math.floor(r() * bookColors.length)];
        s += `<rect x="${n(bx)}" y="${n(ry + rowH * 0.86 - bh)}" width="${n(bw)}" height="${n(bh)}" fill="${c}" opacity="${(0.55 + r() * 0.4).toFixed(2)}"/>`;
        bx += bw + 1.5;
      }
      s += `<rect x="${n(x)}" y="${n(ry + rowH * 0.86)}" width="${n(w)}" height="${n(rowH * 0.12)}" fill="var(--c-trim)"/>`;
    }
    s += `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(hgt)}" fill="none" stroke="var(--c-trim)" stroke-width="10"/>`;
    return `<g class="obj-shelf">${s}</g>`;
  }

  /** 室内地面 + 后墙 */
  function roomShell(floorY, wallColor = 'var(--c-wall)', floorColor = 'var(--c-floor)') {
    return (
      `<rect x="0" y="0" width="${W}" height="${n(floorY)}" fill="${wallColor}"/>` +
      `<rect x="0" y="${n(floorY)}" width="${W}" height="${n(H - floorY)}" fill="${floorColor}"/>` +
      `<rect x="0" y="${n(floorY - 16)}" width="${W}" height="18" fill="var(--c-trim)" opacity=".9"/>`
    );
  }

  /** 黑板 */
  function blackboard(x, y, w, hgt, seed = 5) {
    const r = rng(seed);
    let chalk = '';
    for (let i = 0; i < 7; i++) {
      const cx = x + w * (0.08 + r() * 0.6);
      const cy = y + hgt * (0.2 + r() * 0.55);
      const len = 30 + r() * 120;
      chalk += `<rect x="${n(cx)}" y="${n(cy)}" width="${n(len)}" height="4" rx="2" fill="#eef3ea" opacity="${(0.18 + r() * 0.3).toFixed(2)}"/>`;
    }
    return (
      `<g><rect x="${n(x - 14)}" y="${n(y - 14)}" width="${n(w + 28)}" height="${n(hgt + 28)}" rx="8" fill="var(--c-wood)"/>` +
      `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(hgt)}" fill="#3c4f4a"/>` +
      `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(hgt)}" fill="url(#bb-sheen)"/>${chalk}` +
      `<rect x="${n(x - 20)}" y="${n(y + hgt + 16)}" width="${n(w + 40)}" height="12" rx="5" fill="var(--c-wood)"/></g>`
    );
  }

  function defsCommon() {
    return (
      `<defs>` +
      grad('bb-sheen', [[0, '#ffffff', 0.06], [0.5, '#ffffff', 0.02], [1, '#ffffff', 0]]) +
      rgrad('soft-light', [[0, 'var(--c-lamp)', 0.5], [0.55, 'var(--c-lamp)', 0.12], [1, 'var(--c-lamp)', 0]]) +
      grad('water-grad', [[0, 'var(--c-water)', 1], [1, 'var(--c-water2)', 1]]) +
      grad('wall-v', [[0, '#ffffff', 0.14], [0.6, '#ffffff', 0], [1, '#000000', 0.16]]) +
      rgrad('focus', [[0, 'var(--c-warm)', 0.35], [1, 'var(--c-warm)', 0]]) +
      // 地平线那一条暖光：把天地接起来，画面才不像两块布贴在一起
      grad('horizon-glow', [[0, 'var(--c-warm)', 0], [0.55, 'var(--c-warm)', 0.16], [1, 'var(--c-warm)', 0]]) +
      `</defs>`
    );
  }

  /* ---------------------------- 天空 / 天体层 ----------------------------- */

  function skyExtra(sceneKey, seed = 11) {
    // 云层由独立 DOM 层负责飘动，这里只放静态的远景霞光
    return svg(
      defsCommon() +
        `<g class="haze" opacity="var(--glow-a)">` +
        `<ellipse cx="${W * 0.72}" cy="${H * 0.2}" rx="520" ry="240" fill="var(--c-warm)" opacity=".18"/>` +
        `<ellipse cx="${W * 0.22}" cy="${H * 0.3}" rx="420" ry="190" fill="var(--c-warm)" opacity=".1"/>` +
        `<rect x="0" y="${HORIZON - 74}" width="${W}" height="140" fill="url(#horizon-glow)"/>` +
        `<ellipse cx="${W * 0.13}" cy="${HORIZON - 26}" rx="640" ry="128" fill="var(--sky-mid)" opacity=".2"/>` +
        `<ellipse cx="${W * 0.9}" cy="${HORIZON - 2}" rx="580" ry="116" fill="var(--sky-2)" opacity=".16"/>` +
        `</g>`
    );
  }

  /* ------------------------------- 场景合成 ------------------------------- */

  const BUILDERS = {
    /* ---- 校门口 ---- */
    campus() {
      let mid = hills(HORIZON + 6, 46, 'var(--c-mid)', 21, 0.85);
      mid += building(980, HORIZON + 10, 560, 300, { cols: 6, rows: 3, seed: 31, roofStyle: 'flat', lit: 0.4 });
      mid += building(120, HORIZON + 14, 320, 210, { cols: 3, rows: 2, seed: 44, roofStyle: 'gable', lit: 0.35 });
      // 校门：两根柱子 + 横梁 + 校名牌
      mid +=
        `<g class="obj-gate"><rect x="612" y="${HORIZON - 260}" width="34" height="280" fill="var(--c-wall)"/>` +
        `<rect x="954" y="${HORIZON - 260}" width="34" height="280" fill="var(--c-wall)"/>` +
        `<rect x="596" y="${HORIZON - 300}" width="66" height="26" rx="6" fill="var(--c-roof)"/>` +
        `<rect x="938" y="${HORIZON - 300}" width="66" height="26" rx="6" fill="var(--c-roof)"/>` +
        `<rect x="612" y="${HORIZON - 292}" width="376" height="42" rx="8" fill="var(--c-wall)"/>` +
        `<rect x="612" y="${HORIZON - 292}" width="376" height="42" rx="8" fill="var(--c-trim)" opacity=".35"/>` +
        `<text x="800" y="${HORIZON - 262}" text-anchor="middle" font-size="30" letter-spacing="10" fill="var(--c-accent)" font-family="serif">晴 天 大 学</text>` +
        `</g>`;
      mid += tree(220, HORIZON + 26, 1.0, 7) + tree(1380, HORIZON + 20, 1.15, 9) + tree(430, HORIZON + 22, 0.7, 13);
      mid += lamp(540, HORIZON + 30, 0.9, 5) + lamp(1070, HORIZON + 30, 0.9, 6);

      let near = groundLine(HORIZON + 40, 'var(--c-ground)', 3, 18);
      near += brickPath(700, 900, HORIZON + 30, H + 40);
      near += `<path d="M 700 ${HORIZON + 30} L 900 ${HORIZON + 30} L 1140 ${H + 40} L 460 ${H + 40} Z" fill="var(--c-path)" opacity=".55"/>`;
      near += bush(150, HORIZON + 86, 1.1, 17) + bush(1460, HORIZON + 92, 1.2, 19) + bush(1120, HORIZON + 60, 0.7, 23);
      near += `<g opacity=".5"><rect x="250" y="${HORIZON + 40}" width="190" height="8" rx="3" fill="var(--c-trim)"/></g>`;
      near += tree(60, HORIZON + 130, 1.7, 41) + tree(1560, HORIZON + 150, 1.85, 43);

      let fore = `<path d="M -20 ${H - 120} q 340 -70 760 -34 q 420 36 880 96 L ${W + 20} ${H + 20} L -20 ${H + 20} Z" fill="var(--c-ground2)" opacity=".55"/>`;
      fore += `<g opacity=".5">${bush(90, H - 88, 1.6, 61)}${bush(1520, H - 100, 1.8, 63)}</g>`;

      return { far: svg(hills(HORIZON - 60, 90, 'var(--c-far)', 5, 0.7)), mid: svg(mid), near: svg(near), fore: svg(fore) };
    },

    /* ---- 林荫道 ---- */
    avenue() {
      let mid = hills(HORIZON - 10, 60, 'var(--c-far)', 71, 0.6);
      mid += `<path d="M 700 ${HORIZON - 40} L 900 ${HORIZON - 40} L 1180 ${H} L 420 ${H} Z" fill="var(--c-path)" opacity=".7"/>`;
      mid += building(620, HORIZON - 30, 360, 170, { cols: 4, rows: 2, seed: 77, lit: 0.5, roofStyle: 'gable' });
      // 两侧行道树，越靠前越大，形成隧道
      for (let i = 0; i < 5; i++) {
        const t = i / 4;
        const s = 0.72 + t * 1.1;
        const y = HORIZON - 20 + t * 300;
        mid += tree(180 - t * 130, y, s, 100 + i * 7);
        mid += tree(1420 + t * 150, y, s, 140 + i * 5);
      }
      // 头顶树冠
      let canopy = '';
      for (let i = 0; i < 9; i++) {
        const r2 = rng(200 + i);
        canopy += `<ellipse cx="${n(140 + i * 180 + r2() * 80)}" cy="${n(-40 + r2() * 130)}" rx="${n(190 + r2() * 90)}" ry="${n(120 + r2() * 60)}" fill="${i % 2 ? 'var(--c-leaf)' : 'var(--c-leaf2)'}" opacity=".92"/>`;
      }
      canopy += `<g class="dapple" opacity=".5">`;
      const r3 = rng(303);
      for (let i = 0; i < 12; i++) canopy += `<ellipse cx="${n(r3() * W)}" cy="${n(r3() * 120)}" rx="${n(30 + r3() * 60)}" ry="${n(20 + r3() * 40)}" fill="var(--c-warm)" opacity=".5"/>`;
      canopy += `</g>`;

      let near = groundLine(HORIZON + 20, 'var(--c-ground)', 8, 14);
      near += `<path d="M 700 ${HORIZON} L 900 ${HORIZON} L 1240 ${H + 40} L 360 ${H + 40} Z" fill="var(--c-path)"/>`;
      const rp = rng(404);
      for (let i = 0; i < 26; i++) {
        const y = HORIZON + i * 15;
        near += `<rect x="${n(700 - i * 13 + rp() * 6)}" y="${n(y)}" width="${n(200 + i * 26)}" height="3" fill="var(--c-trim)" opacity=".35"/>`;
      }
      near += bench(150, HORIZON + 190, 1.3) + bench(1330, HORIZON + 240, 1.5);
      near += lamp(480, HORIZON + 90, 0.8, 8) + lamp(1160, HORIZON + 120, 0.95, 9);

      const fore = `<g>${bush(40, H - 60, 2.2, 91)}${bush(1560, H - 40, 2.4, 93)}</g>`;
      return {
        far: svg(defsCommon() + hills(HORIZON - 120, 110, 'var(--c-far)', 61, 0.5) + svgWrap(canopy)),
        mid: svg(mid),
        near: svg(near),
        fore: svg(fore),
      };
    },

    /* ---- 社团大道 ---- */
    club() {
      let mid = hills(HORIZON, 40, 'var(--c-mid)', 111, 0.75);
      mid += building(1120, HORIZON + 6, 460, 260, { cols: 5, rows: 3, seed: 113, lit: 0.45 });
      const bannerColors = ['var(--c-accent)', 'var(--c-bloom)', 'var(--c-leaf2)', 'var(--c-trim)', 'var(--c-water)'];
      // 摊位
      for (let i = 0; i < 5; i++) {
        const x = 150 + i * 300;
        const s = 0.85 + i * 0.06;
        const y = HORIZON + 30 + i * 12;
        const c = bannerColors[i % bannerColors.length];
        mid +=
          `<g class="obj-booth"><rect x="${n(x)}" y="${n(y - 130 * s)}" width="${n(200 * s)}" height="${n(8 * s)}" fill="var(--c-trim)"/>` +
          `<rect x="${n(x + 6 * s)}" y="${n(y - 132 * s)}" width="${n(9 * s)}" height="${n(132 * s)}" fill="var(--c-trim)"/>` +
          `<rect x="${n(x + 186 * s)}" y="${n(y - 132 * s)}" width="${n(9 * s)}" height="${n(132 * s)}" fill="var(--c-trim)"/>` +
          `<path d="${poly([[x - 14 * s, y - 132 * s], [x + 214 * s, y - 132 * s], [x + 196 * s, y - 178 * s], [x + 4 * s, y - 178 * s]])}" fill="${c}"/>` +
          `<path d="${poly([[x - 14 * s, y - 132 * s], [x - 14 * s, y - 178 * s + 46], [x + 30 * s, y - 178 * s + 40], [x + 30 * s, y - 132 * s]])}" fill="#000" opacity=".1"/>` +
          `<rect x="${n(x + 30 * s)}" y="${n(y - 62 * s)}" width="${n(140 * s)}" height="${n(62 * s)}" fill="var(--c-wall)"/>` +
          `<rect x="${n(x + 42 * s)}" y="${n(y - 50 * s)}" width="${n(116 * s)}" height="${n(30 * s)}" fill="${c}" opacity=".55"/></g>`;
      }
      mid += tree(760, HORIZON + 14, 0.95, 131) + lamp(1420, HORIZON + 24, 0.85, 12);

      let near = groundLine(HORIZON + 44, 'var(--c-ground)', 13, 16);
      near += `<path d="${poly([[520, HORIZON + 40], [1080, HORIZON + 40], [1420, H + 40], [180, H + 40]])}" fill="var(--c-path)" opacity=".85"/>`;
      near += figure(360, HORIZON + 130, 2.6, 'var(--c-ink)', 141) + figure(470, HORIZON + 150, 2.9, 'var(--c-ink)', 143);
      near += figure(1180, HORIZON + 140, 2.7, 'var(--c-ink)', 145) + figure(1290, HORIZON + 170, 3.1, 'var(--c-ink)', 147);
      near += bush(60, HORIZON + 110, 1.5, 149) + bush(1540, HORIZON + 120, 1.6, 151);

      const fore = `<path d="M -20 ${H - 90} q 400 -60 820 -22 q 420 38 820 84 L ${W + 20} ${H + 20} L -20 ${H + 20} Z" fill="var(--c-ground2)" opacity=".5"/>`;
      return { far: svg(hills(HORIZON - 50, 80, 'var(--c-far)', 101, 0.6)), mid: svg(mid), near: svg(near), fore: svg(fore) };
    },

    /* ---- 食堂门口 ---- */
    canteen() {
      let mid = hills(HORIZON - 6, 42, 'var(--c-mid)', 211, 0.7);
      mid += building(240, HORIZON + 12, 1120, 320, { cols: 8, rows: 3, seed: 213, lit: 0.75, win: 'var(--c-glass)' });

      const deckY = HORIZON + 120;

        [0, 1].map((i) => `<rect x="0" y="${n(deckY + 40 + i * 30)}" width="${W}" height="5" fill="var(--c-metal)" opacity=".9"/>`).join('') +
        Array.from({ length: 12 }, (_, i) => `<rect x="${n(40 + i * 136)}" y="${deckY + 34}" width="8" height="70" fill="var(--c-metal)" opacity=".9"/>`).join('') +
        `</g>`;
      // 空调外机
      near += `<g opacity=".95"><rect x="120" y="${deckY + 150}" width="190" height="120" rx="8" fill="var(--c-wall2)"/>` +
        `<circle cx="215" cy="${deckY + 210}" r="38" fill="none" stroke="var(--c-metal)" stroke-width="8"/>` +
        `<rect x="142" y="${deckY + 168}" width="146" height="12" rx="4" fill="var(--c-metal)" opacity=".6"/></g>`;
      near += `<g opacity=".9"><rect x="1260" y="${deckY + 190}" width="150" height="90" rx="6" fill="var(--c-metal)" opacity=".85"/></g>`;
      near += `<rect x="0" y="0" width="${W}" height="${H}" fill="url(#wall-v)" opacity=".28"/>`;
      const fore = grassFore(H - 60, 0.26, 419, 'var(--c-metal)');

      // 看台
      mid += `<g opacity=".95">${[0, 1, 2, 3, 4].map((i) => `<rect x="1080" y="${n(HORIZON + 10 + i * 26)}" width="520" height="24" fill="${i % 2 ? 'var(--c-wall2)' : 'var(--c-wall)'}"/>`).join('')}` +

      const ty = HORIZON + 60;

    hall() {
      let far = defsCommon() + `<rect x="0" y="0" width="${W}" height="${H}" fill="#1b242a"/>`;
      far += `<rect x="0" y="0" width="${W}" height="${H}" fill="url(#wall-v)" opacity=".3"/>`;
      // 幕布
      far += `<rect x="300" y="70" width="1000" height="470" rx="10" fill="#0f171b"/>`;
      far += `<rect x="316" y="86" width="968" height="438" rx="6" fill="#f2f5e9"/>`;
      far += `<rect x="316" y="86" width="968" height="438" rx="6" fill="var(--c-water)" opacity=".22"/>`;
      far += `<rect x="316" y="86" width="968" height="438" rx="6" fill="url(#focus)" opacity="var(--lamp-a)"/>`;
      // 幕上的画面：湖与树
      far += `<g opacity=".5"><rect x="316" y="330" width="968" height="194" fill="var(--c-water2)" opacity=".5"/>` +
        `<ellipse cx="620" cy="352" rx="120" ry="46" fill="var(--c-mid)" opacity=".8"/>` +
        `<ellipse cx="1080" cy="366" rx="150" ry="40" fill="var(--c-mid)" opacity=".7"/>` +
        `<circle cx="1120" cy="180" r="52" fill="var(--c-warm)" opacity=".8"/></g>`;
      // 投影光束
      far += `<g class="projector-beam"><path d="M 1250 336 L 1480 900 L 1180 900 Z" fill="#ffffff" opacity=".06"/></g>`;
      // 观众席的浮尘
      far += `<g opacity=".4">${(() => { const r = rng(601); let s = ''; for (let i = 0; i < 46; i++) s += `<circle cx="${n(140 + r() * 1320)}" cy="${n(420 + r() * 300)}" r="${n(1 + r() * 2)}" fill="#fff" opacity="${(0.2 + r() * 0.5).toFixed(2)}"/>`; return s; })()}</g>`;

      let mid = '';
      for (let row = 0; row < 5; row++) {
        const y = 556 + row * 68;
        const s = 0.58 + row * 0.15;
        mid += `<g>`;
        for (let col = 0; col < 8; col++) {
          const x = -20 + col * 214 - row * 10;
          mid += `<path d="M ${n(x)} ${n(y)} h ${n(168 * s)} q ${n(34 * s)} ${n(-60 * s)} ${n(116 * s)} 0 z" fill="var(--c-ink)" opacity="${(0.75 + row * 0.05).toFixed(2)}"/>`;
          mid += `<circle cx="${n(x + 34 * s)}" cy="${n(y - 20 * s)}" r="${n(28 * s)}" fill="var(--c-ink)"/>`;
          mid += `<path d="M ${n(x)} ${n(y)} h ${n(168 * s)}" stroke="#ffffff" stroke-width="2.4" opacity=".14"/>`;
        }
        mid += `</g>`;
      }
      const near = `<path d="M -20 ${H - 56} q 800 -46 1640 0 L 1640 920 L -20 920 Z" fill="#111a1f"/>` +
        `<path d="M -20 ${H - 56} q 800 -46 1640 0" fill="none" stroke="#ffffff" stroke-width="3" opacity=".1"/>`;
      return { far: svg(far), mid: svg(mid), near: svg(near), fore: svg(`<rect x="0" y="0" width="${W}" height="${H}" fill="#000" opacity=".05"/>`) };
    },
  };

  // avenue 用到的小工具（保持作用域干净）
  function svgWrap(c) {
    return `<g class="avenue-canopy">${c}</g>`;
  }

  /** 未知地点回退到校门口 */
  function build(key) {
    const fn = BUILDERS[key] || BUILDERS.campus;
    const out = fn();
    return Object.assign({ sky: skyExtra(key) }, out);
  }

  SP.art = { build, BUILDERS, W, H, HORIZON, cloud, stars, defsCommon, tree, hills, smooth };
  SP.cloudShape = (seed) => svg(cloud(seed), 'cloud-svg');
})(window);

      arp: [0, 2, 1, 2, 0, 1, 2, 1], arpB: [1, 2, 2, 0, 1, 2, 0, 2], sparkle: 0.5, bass: 1.0,
    },
  };

  /* ---------------------- 每个场景一点点自己的音色 ----------------------
   * 同一套和声，换个场景换一种音色和音区，耳朵能听出「换地方了」。
   * semi: 相对主音偏移的半音；wave: 波形；gain: 长音音量；pan: 左右。
   * motif: 这个地方的「主题动机」——每隔几小节冒个头。
   * ------------------------------------------------------------------ */
  const SCENE_TONE = {
    campus: { semi: 0, wave: 'triangle', gain: 1.0, pan: -0.15, motif: [0, 2, 4, 2], every: 8, voice: 'triangle' },
    avenue: { semi: 7, wave: 'sine', gain: 0.9, pan: 0.18, motif: [0, 4, 7], every: 6, voice: 'sine' },
    club: { semi: 5, wave: 'triangle', gain: 0.95, pan: 0.22, motif: [7, 4, 2, 4], every: 4, voice: 'triangle' },
    canteen: { semi: -5, wave: 'sawtooth', gain: 0.5, pan: -0.2, motif: [0, 3, 5], every: 6, voice: 'square' },
    plaza: { semi: 2, wave: 'sine', gain: 0.95, pan: 0, motif: [4, 2, 0], every: 8, voice: 'sine' },
    classroom: { semi: -7, wave: 'triangle', gain: 0.85, pan: -0.12, motif: [0, 2, 3], every: 8, voice: 'triangle' },
    lecture: { semi: -12, wave: 'sine', gain: 1.1, pan: 0, motif: [0, 7], every: 8, voice: 'sine' },
    dorm: { semi: 4, wave: 'triangle', gain: 0.95, pan: 0.14, motif: [0, 2, 5, 4], every: 6, voice: 'triangle' },
    library: { semi: -4, wave: 'sine', gain: 0.9, pan: 0.1, motif: [0, 3, 7, 5], every: 6, voice: 'sine' },
    lake: { semi: 9, wave: 'sine', gain: 0.95, pan: -0.22, motif: [0, 4, 9, 7], every: 8, voice: 'sine' },
    cafe: { semi: 3, wave: 'triangle', gain: 0.8, pan: 0.2, motif: [2, 4, 6], every: 6, voice: 'triangle' },
    roof: { semi: 12, wave: 'sine', gain: 0.85, pan: -0.1, motif: [0, 5, 9], every: 8, voice: 'sine' },
    track: { semi: 7, wave: 'triangle', gain: 0.9, pan: 0.16, motif: [0, 3, 5, 7], every: 4, voice: 'triangle' },
    hall: { semi: -12, wave: 'sine', gain: 1.15, pan: 0, motif: [0, 5], every: 8, voice: 'sine' },
  };

  /* ---------------------- 场景事件音：这个地方在发生什么 -------------------
   * 环境底噪只说明「在哪」，这些零碎的声音才说明「这里正在干什么」：
   * 图书馆翻书、食堂勺子碰碗、走廊脚步、放映机的嗡鸣、操场上的一声哨。
   * 都是短促的合成音，按场景稀疏触发，不铺满。
   * ------------------------------------------------------------------ */
  const SCENE_SFX = {
    campus: ['bell', 'pigeon'],
    avenue: ['bike', 'leaf'],
    club: ['paper', 'bell'],
    canteen: ['cutlery', 'cutlery'],
    plaza: ['pigeon', 'pigeon'],
    classroom: ['chair', 'paper'],
    lecture: ['projector', 'chair'],
    dorm: ['step', 'door'],
    library: ['page', 'page'],
    lake: ['gull', 'water'],
    cafe: ['cup', 'chair'],
    roof: ['wind', 'door'],
    track: ['whistle', 'ball'],
    hall: ['chair', 'door'],
  };

  /** 短促事件音库：全部短、少、一次性 */
  const SCENE_SFX_FN = {
    page() {                                  // 翻书
      const at = now() + 0.001, ctx = Audio.ctx;
      for (let i = 0; i < 2; i++) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuffer(0.25);
        const f = ctx.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = 2600 - i * 500; f.Q.value = 0.7;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, at + i * 0.09);
        g.gain.exponentialRampToValueAtTime(0.035, at + i * 0.09 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, at + i * 0.09 + 0.16);
        s.connect(f).connect(g).connect(Audio.bus.amb);
        s.start(at + i * 0.09); s.stop(at + i * 0.09 + 0.25);
      }
    },
    cutlery() {                               // 勺子碰碗
      const at = now() + 0.001;
      for (let i = 0; i < 3; i++) {
        tone(2100 + Math.random() * 1500, at + i * 0.06, 0.16, 0.014, 'triangle', 0.5, 0, (Math.random() - 0.5) * 0.5);
      }
    },
    cup() { tone(880, now() + 0.001, 0.22, 0.016, 'sine', 0.4); tone(1320, now() + 0.03, 0.16, 0.009, 'sine', 0.5); },
    chair() {                                 // 椅子挪一下
      const at = now() + 0.001, ctx = Audio.ctx;
      const s = ctx.createBufferSource();
      s.buffer = noiseBuffer(0.3);
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.setValueAtTime(900, at);
      f.frequency.exponentialRampToValueAtTime(260, at + 0.22);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.03, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.26);
      s.connect(f).connect(g).connect(Audio.bus.amb);
      s.start(at); s.stop(at + 0.3);
    },
    step() {                                  // 走廊上一声脚步
      const at = now() + 0.001;
      tone(120, at, 0.1, 0.02, 'sine', 0.3);
      tone(190, at + 0.11, 0.09, 0.014, 'sine', 0.3);
    },
    door() {                                  // 门轴
      const at = now() + 0.001;
      tone(320, at, 0.5, 0.012, 'sawtooth', 0.5, 0, -0.2);
      tone(318, at + 0.42, 0.4, 0.01, 'sawtooth', 0.5, 0, -0.2);
    },
    projector() {                             // 放映机转起来的那种嗡
      const at = now() + 0.001;
      tone(58, at, 2.6, 0.016, 'sawtooth', 0.4, 0, 0.1);
      tone(116, at, 2.4, 0.008, 'sine', 0.4, 6, 0.1);
      tone(174, at + 0.4, 0.2, 0.006, 'triangle', 0.6, 0, 0.1);
    },
    pigeon() {                                // 鸽群扑翅膀
      const at = now() + 0.001;
      for (let i = 0; i < 5; i++) tone(600 + Math.random() * 700, at + i * 0.07, 0.09, 0.009, 'triangle', 0.4, 0, (Math.random() - 0.5) * 0.6);
    },
    gull() {
      const at = now() + 0.001;
      for (let i = 0; i < 3; i++) tone(1500 - i * 180, at + i * 0.16, 0.2, 0.012, 'sine', 0.6, 0, 0.25);
    },
    water() {
      const at = now() + 0.001, ctx = Audio.ctx;
      const s = ctx.createBufferSource();
      s.buffer = noiseBuffer(0.6);
      const f = ctx.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 0.6;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.02, at + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.5);
      s.connect(f).connect(g).connect(Audio.bus.amb);
      s.start(at); s.stop(at + 0.6);
    },
    wind() {
      const at = now() + 0.001, ctx = Audio.ctx;
      const s = ctx.createBufferSource();
      s.buffer = noiseBuffer(2.2);
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.setValueAtTime(300, at);
      f.frequency.linearRampToValueAtTime(760, at + 1.1);
      f.frequency.linearRampToValueAtTime(280, at + 2.1);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(0.028, at + 0.8);
      g.gain.linearRampToValueAtTime(0.0001, at + 2.1);
      s.connect(f).connect(g).connect(Audio.bus.amb);
      s.start(at); s.stop(at + 2.2);
    },
    bell() {                                  // 校园广播的尾音
      const at = now() + 0.001;
      [0, 7, 12].forEach((s, i) => tone(523.25 * Math.pow(2, s / 12), at + i * 0.1, 1.2, 0.012, 'sine', 0.8, 0, 0.2));
    },
    bike() {
      const at = now() + 0.001;
      for (let i = 0; i < 2; i++) tone(2400, at + i * 0.12, 0.1, 0.012, 'triangle', 0.5, 0, 0.3);
    },
    leaf() { SCENE_SFX_FN.paper(); },
    paper() {
      const at = now() + 0.001, ctx = Audio.ctx;
      const s = ctx.createBufferSource();
      s.buffer = noiseBuffer(0.3);
      const f = ctx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 3200;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.016, at + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.26);
      s.connect(f).connect(g).connect(Audio.bus.amb);
      s.start(at); s.stop(at + 0.3);
    },
    whistle() {
      const at = now() + 0.001;
      tone(2100, at, 0.16, 0.016, 'sine', 0.4, 0, 0.3);
      tone(2350, at + 0.2, 0.22, 0.014, 'sine', 0.4, 0, 0.3);
    },
    ball() {
      const at = now() + 0.001;
      tone(320, at, 0.18, 0.02, 'triangle', 0.5, 0, 0.2);
      tone(240, at + 0.14, 0.22, 0.014, 'triangle', 0.5, 0, 0.2);
    },
  };

  let sceneSfxNext = 0;
  /** 稀疏触发当前场景的一个事件音 */
  function tickSceneSfx() {
    if (!Audio.enabled || !Audio.ctx) return;
    const t = Audio.ctx.currentTime;
    if (t < sceneSfxNext) return;
    const pool = SCENE_SFX[Audio._scene];
    const gap = Audio._weather === 'rain' ? 14 : 9;      // 下雨天外面少发生点事
    sceneSfxNext = t + gap * (0.55 + Math.random() * 1.1);
    if (!pool || !pool.length) return;
    const name = pool[Math.floor(Math.random() * pool.length)];
    const fn = SCENE_SFX_FN[name];
    if (!fn) return;
    try { fn(); } catch {}
  }

  /* ------------------------------- 环境音配置 ------------------------------ */
  const AMB = {
    campus: { type: 'lowpass', freq: 520, gain: 0.030, lfo: 0.06 },
    avenue: { type: 'lowpass', freq: 460, gain: 0.032, lfo: 0.09 },
    club: { type: 'bandpass', freq: 900, gain: 0.038, lfo: 0.22 },
    canteen: { type: 'bandpass', freq: 640, gain: 0.036, lfo: 0.18 },
    plaza: { type: 'lowpass', freq: 600, gain: 0.030, lfo: 0.08 },
    classroom: { type: 'lowpass', freq: 380, gain: 0.016, lfo: 0.05 },
    lecture: { type: 'lowpass', freq: 340, gain: 0.015, lfo: 0.05 },
    dorm: { type: 'bandpass', freq: 1350, gain: 0.034, lfo: 0.1 },
    library: { type: 'lowpass', freq: 280, gain: 0.013, lfo: 0.04 },
    lake: { type: 'lowpass', freq: 1000, gain: 0.034, lfo: 0.14 },
    cafe: { type: 'bandpass', freq: 420, gain: 0.028, lfo: 0.12 },
    roof: { type: 'lowpass', freq: 700, gain: 0.038, lfo: 0.07 },
    track: { type: 'lowpass', freq: 740, gain: 0.038, lfo: 0.09 },
    hall: { type: 'lowpass', freq: 300, gain: 0.020, lfo: 0.05 },
  };

  const Audio = {
    ctx: null,
    ready: false,
    enabled: false,
    _mood: 'warm',
    _scene: 'campus',
    _weather: 'clear',
    played: 0,
    _vol: { master: 0.8, music: 0.62, amb: 0.5, sfx: 0.6 },
    _tick: null,
    _nextTime: 0,
    _step: 0,
    _startedAt: 0,
    tts: false,
  };

  /* ------------------------------- 初始化 -------------------------------- */

  function ensure() {
    if (Audio.ctx) return true;
    const Ctx = global.AudioContext || global.webkitAudioContext;
    if (!Ctx) return false;
    try {
      const ctx = new Ctx();
      Audio.ctx = ctx;

      Audio.master = ctx.createGain();
      Audio.master.gain.value = 0;
      Audio.comp = ctx.createDynamicsCompressor();
      Audio.comp.threshold.value = -14;
      Audio.comp.knee.value = 22;
      Audio.comp.ratio.value = 3.2;
      Audio.comp.attack.value = 0.006;
      Audio.comp.release.value = 0.28;
      Audio.master.connect(Audio.comp).connect(ctx.destination);

      Audio.bus = {};
      for (const k of ['music', 'amb', 'sfx']) {
        const g = ctx.createGain();
        g.gain.value = Audio._vol[k];
        g.connect(Audio.master);
        Audio.bus[k] = g;
      }

      // 生成式混响脉冲响应（无需外部音频文件）
      const len = Math.floor(ctx.sampleRate * 2.6);
      const ir = ctx.createBuffer(2, len, ctx.sampleRate);
      const r = rng(20260917);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          const t = i / len;
          d[i] = (r() * 2 - 1) * Math.pow(1 - t, 2.6) * (i < 240 ? i / 240 : 1);
        }
      }
      Audio.rev = ctx.createConvolver();
      Audio.rev.buffer = ir;
      Audio.revGain = ctx.createGain();
      Audio.revGain.gain.value = 1;
      Audio.rev.connect(Audio.revGain).connect(Audio.master);

      Audio.ready = true;
      return true;
    } catch {
      return false;
    }
  }

  function now() {
    return Audio.ctx ? Audio.ctx.currentTime : 0;
  }

  /* ------------------------------ 基础发声 ------------------------------- */

  /** 单个音符，带指数包络，可送入混响；pan>0 偏右，<0 偏左 */
  function tone(freq, at, dur, vol, type = 'sine', revSend = 0, detune = 0, pan = 0) {
    const ctx = Audio.ctx;
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, at);
    if (detune) osc.detune.setValueAtTime(detune, at);
    env.gain.setValueAtTime(0.0001, at);
    env.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), at + 0.045);
    env.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(env);
    let tail = env;
    if (pan && ctx.createStereoPanner) {
      const p = ctx.createStereoPanner();
      p.pan.value = clamp(pan, -1, 1);
      env.connect(p);
      tail = p;
    }
    tail.connect(Audio.bus.music);
    if (revSend > 0) {
      const send = ctx.createGain();
      send.gain.value = revSend;
      tail.connect(send).connect(Audio.rev);
    }
    osc.start(at);
    osc.stop(at + dur + 0.05);
  }

  /** 噪声源（环境音 / 打击音） */
  function noiseBuffer(seconds = 2) {
    const ctx = Audio.ctx;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * seconds), ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02; // 轻微布朗化，听感更自然
      d[i] = white * 0.7 + last * 3;
    }
    return buf;
  }

  /* -------------------------------- 音乐 --------------------------------- */

  function stepDur() {
    const m = MOODS[Audio._mood] || MOODS.warm;
    return 60 / m.bpm / 2; // 八分音符
  }

  function scheduleStep(at, step) {
    const m = MOODS[Audio._mood] || MOODS.warm;
    const bar = Math.floor(step / 8);
    const chord = m.chords[bar % m.chords.length];
    const idx = step % 8;
    // 两套琶音按小节交替，同一个情绪也不会一直循环同一条旋律
    const arp = (bar % 2 && m.arpB) ? m.arpB : m.arp;
    const degree = arp[idx];
    const semi = chord[degree % chord.length] + (degree >= chord.length ? 12 : 0);
    const freq = m.root * Math.pow(2, semi / 12);
    const lvl = m.lvl * (0.075 + (idx % 2 ? 0.012 : 0));
    const wet = Audio._weather;
    const rainy = wet === 'rain' || wet === 'drizzle' || wet === 'storm';
    const snowy = wet === 'snow';
    // 琶音在左右之间轻轻摆，画面有视差，声音也该有
    const sway = ((idx % 4) - 1.5) / 1.5 * 0.3;

    // 主音
    tone(freq, at, rainy ? 1.15 : 0.9, lvl * (rainy ? 0.9 : 1), m.wave, m.rev, 0, sway);
    // 低八度垫音
    if (idx === 0 || idx === 4) tone(freq / 2, at, 2.0, lvl * 0.5 * m.bass, 'triangle', m.rev * 1.2, 0, -sway * 0.6);
    // 铺底长音
    if (idx === 0) {
      chord.forEach((c, i) => tone(m.root * Math.pow(2, (c - 12) / 12), at, 3.6, 0.022, 'sine', m.rev * 1.4, i * 4, (i - 1) * 0.3));
    }
    // 场景长音：两小节一次，音色随地方换
    const st = SCENE_TONE[Audio._scene];
    if (st && idx === 0 && bar % 2 === 0) {
      tone(freq * 2 * Math.pow(2, st.semi / 12) / 4, at, 5.6,
        0.02 * st.gain * (rainy ? 1.25 : 1), st.wave, m.rev * 1.5, 0, st.pan);
    }
    // 雨夜多一层很低的气声，像窗户外面那片雨
    if (rainy && idx === 2 && bar % 2 === 1) {
      tone(m.root / 4, at, 4.2, 0.014, 'sine', m.rev * 1.3, 0, 0);
    }
    // 高音点缀（下雨天把亮点收一收，雪天反而更清）
    const r = rng(step * 7919 + (Audio._mood.charCodeAt(0) || 1));
    const sparkMul = rainy ? 0.35 : (snowy ? 1.15 : 1);
    if (r() < 0.36 * m.sparkle * sparkMul) {
      tone(freq * 4, at + stepDur() * 0.5, snowy ? 0.5 : 0.34, 0.012, 'sine', m.rev * 1.6, 0, -sway);
    }
    if (r() < 0.14 * m.sparkle * sparkMul) {
      tone(freq * 6, at + stepDur() * 0.25, 0.26, 0.008, 'triangle', m.rev * 1.8, 0, sway * 1.2);
    }
    // 乐句收尾：每四小节末尾来一个小上行，像一句话说完了
    if (bar % 4 === 3 && idx === 6) {
      [0, 2, 4].forEach((s, i) =>
        tone(freq * Math.pow(2, s / 12) * 2, at + i * stepDur() * 0.5, 0.5, 0.01, 'sine', m.rev * 1.7, 0, sway));
    }
    // 场景主题：这个地方自己的那几个音，隔几小节露一次头
    if (st && st.motif && bar % st.every === st.every - 1 && idx === 0) {
      st.motif.forEach((deg, i) => {
        const f2 = m.root * Math.pow(2, (chord[deg % chord.length] + (deg >= chord.length ? 12 : 0) + st.semi) / 12);
        tone(f2 * 2, at + i * stepDur() * 1.5, 0.9, 0.017, st.voice || 'sine', m.rev * 1.7, 0, st.pan * 1.4);
      });
    }
  }

  function runTick() {
    const ctx = Audio.ctx;
    if (!ctx) return;
    const ahead = 0.45;
    let guard = 0;
    while (Audio._nextTime < ctx.currentTime + ahead && guard++ < 32) {
      scheduleStep(Audio._nextTime, Audio._step);
      Audio._nextTime += stepDur();
      Audio._step++;
    }
    tickSceneSfx();
  }

  /* ------------------------------ 环境音 --------------------------------- */

  let ambNodes = null;

  /** 一层环境噪声：噪声源 → 滤波 → 增益（可左右摆）→ amb 总线 */
  function makeAmbLayer(cfg, target, pan) {
    const ctx = Audio.ctx;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(3);
    src.loop = true;
    const filt = ctx.createBiquadFilter();
    filt.type = cfg.type;
    filt.frequency.value = cfg.freq;
    filt.Q.value = cfg.q == null ? (cfg.type === 'bandpass' ? 0.9 : 0.5) : cfg.q;
    const gain = ctx.createGain();
    gain.gain.value = 0.0001;
    src.connect(filt).connect(gain);
    let tail = gain;
    if (ctx.createStereoPanner) {
      const p = ctx.createStereoPanner();
      p.pan.value = clamp(pan || 0, -1, 1);
      gain.connect(p);
      tail = p;
    }
    tail.connect(Audio.bus.amb);
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    lfo.frequency.value = cfg.lfo || 0.08;
    lfoGain.gain.value = cfg.freq * 0.22;
    lfo.connect(lfoGain).connect(filt.frequency);
    src.start();
    lfo.start();
    gain.gain.setTargetAtTime(target, now(), 0.9);
    return { src, gain, lfo };
  }

  function killAmbience(fade = 0.6) {
    if (!ambNodes) return;
    const old = ambNodes;
    ambNodes = null;
    for (const L of old.layers) {
      try {
        L.gain.gain.cancelScheduledValues(now());
        L.gain.gain.setTargetAtTime(0.0001, now(), fade / 3);
        setTimeout(() => {
          try { L.src.stop(); } catch {}
          try { L.lfo.stop(); } catch {}
        }, fade * 1200);
      } catch {}
    }
  }

  function startAmbience() {
    if (!Audio.enabled || !Audio.ctx) return;
    killAmbience(0.8);
    const a = AMB[Audio._scene] || AMB.campus;
    const w = { clear: 0, fair: 0, overcast: 0.06, drizzle: 0.4, rain: 1, fog: 0.1, snow: 0.25 }[Audio._weather] || 0;

    // 两层：主层是「这个地方的底噪」，副层低一个八度、反方向摆，空间立刻宽了
    const main = {
      type: w > 0.3 ? 'highpass' : a.type,
      freq: w > 0.3 ? 900 : a.freq,
      lfo: a.lfo,
    };
    const sub = {
      type: a.type === 'bandpass' ? 'lowpass' : 'bandpass',
      freq: Math.max(120, (w > 0.3 ? 420 : a.freq) * 0.34),
      lfo: a.lfo * 0.57,
    };
    const base = a.gain * (1 + w * 1.6);
    const layers = [
      makeAmbLayer(main, base, -0.18),
      makeAmbLayer(sub, base * 0.62, 0.22),
    ];
    ambNodes = { layers, base, subRatio: 0.62 };
    Audio._ambBase = base;
  }

  /** 天气变化时平滑调整环境音 */
  function updateAmbience() {
    if (!ambNodes) return;
    const a = AMB[Audio._scene] || AMB.campus;
    const w = { clear: 0, fair: 0, overcast: 0.06, drizzle: 0.4, rain: 1, fog: 0.1, snow: 0.25 }[Audio._weather] || 0;
    const base = a.gain * (1 + w * 1.6);
    const ratio = ambNodes.subRatio || 0.62;
    ambNodes.layers[0].gain.gain.setTargetAtTime(base, now(), 1.2);
    if (ambNodes.layers[1]) ambNodes.layers[1].gain.gain.setTargetAtTime(base * ratio, now(), 1.2);
  }

  /* -------------------------------- 音效 --------------------------------- */

  const SFX = {
    click() {
      tone(1180, now() + 0.001, 0.07, 0.05, 'triangle', 0.2);
      tone(1760, now() + 0.03, 0.06, 0.028, 'sine', 0.25);
    },
    page() {
      const ctx = Audio.ctx, at = now();
      const s = ctx.createBufferSource();
      s.buffer = noiseBuffer(0.4);
      const f = ctx.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.8;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.07, at + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.18);
      s.connect(f).connect(g).connect(Audio.bus.sfx);
      s.start(at); s.stop(at + 0.4);
    },
    choice() {
      const at = now() + 0.001;
      [0, 5, 9].forEach((s, i) => tone(523.25 * Math.pow(2, s / 12), at + i * 0.055, 0.34, 0.05, 'sine', 0.5));
    },
    hover() {
      tone(1320, now() + 0.001, 0.045, 0.018, 'sine', 0.15);
    },
    whoosh() {
      const ctx = Audio.ctx, at = now();
      const s = ctx.createBufferSource();
      s.buffer = noiseBuffer(1.2);
      const f = ctx.createBiquadFilter();
      f.type = 'bandpass'; f.Q.value = 1.4;
      f.frequency.setValueAtTime(220, at);
      f.frequency.exponentialRampToValueAtTime(1900, at + 0.5);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.05, at + 0.16);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.72);
      s.connect(f).connect(g).connect(Audio.bus.sfx);
      const send = ctx.createGain(); send.gain.value = 0.5; g.connect(send).connect(Audio.rev);

    },
    thunder() {
      const ctx = Audio.ctx, at = now();
      const s = ctx.createBufferSource();
      s.buffer = noiseBuffer(2.4);
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(420, at);
      f.frequency.exponentialRampToValueAtTime(90, at + 1.8);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.09, at + 0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 2.2);
      s.connect(f).connect(g).connect(Audio.bus.sfx);
      const send = ctx.createGain(); send.gain.value = 0.7; g.connect(send).connect(Audio.rev);
      s.start(at); s.stop(at + 2.4);
      tone(58, at + 0.05, 1.9, 0.05, 'sine', 0.6);
    },
    fireworks() {
      const at = now();
      for (let i = 0; i < 22; i++) {
        tone(400 + Math.random() * 2400, at + i * 0.035 + Math.random() * 0.02, 0.2, 0.014, 'triangle', 0.6);
      }
      tone(72, at + 0.1, 1.2, 0.05, 'sine', 0.5);
    },
    crowd() {
      const at = now();
      for (let i = 0; i < 5; i++) tone(300 + i * 90, at + i * 0.09, 0.5, 0.012, 'triangle', 0.6);
    },
    rainwalk() {
      const at = now();
      for (let i = 0; i < 7; i++) tone(1500 + Math.random() * 900, at + i * 0.11, 0.14, 0.01, 'sine', 0.5);
    },
    unlock() {
      const at = now() + 0.001;
      [0, 4, 7, 12, 16].forEach((s, i) => tone(392 * Math.pow(2, s / 12), at + i * 0.09, 0.9, 0.045, 'sine', 0.7));
    },
    // 留念物：一段只响一次的五声音阶小句子，比 unlock 更慢、更软
    keepsake() {
      const at = now() + 0.001;
      [0, 4, 7, 12, 7, 4].forEach((s, i) =>
        tone(329.63 * Math.pow(2, s / 12), at + i * 0.17, 1.1, 0.04, 'sine', 0.85));
      tone(164.81, at, 2.8, 0.035, 'triangle', 0.7);
    },
    // 全屏 CG 揭晓：一层很轻的上行泛音，像画面里慢慢亮起来的那点光
    cg() {
      const at = now() + 0.001;
      [0, 7, 12, 19, 24].forEach((s, i) =>
        tone(261.63 * Math.pow(2, s / 12), at + i * 0.13, 1.7, 0.022, 'sine', 0.85));
      tone(98, at, 2.6, 0.03, 'triangle', 0.6);
    },
    // 面板开合：比 click 厚一点的木头声
    panel(open) {
      const at = now() + 0.001;
      const base = open ? 392 : 311.13;
      tone(base, at, 0.26, 0.032, 'triangle', 0.45);
      tone(base * 1.5, at + 0.05, 0.3, 0.018, 'sine', 0.5);
    },
    ending() {
      const at = now() + 0.001;
      [0, 4, 7, 12].forEach((s, i) => tone(261.63 * Math.pow(2, s / 12), at + i * 0.16, 2.4, 0.05, 'sine', 0.8));
      tone(130.81, at, 3.2, 0.05, 'triangle', 0.7);
    },

  function sfx(name, arg) {
    if (!Audio.ready || !Audio.enabled) return;
    try {
      if (Audio.ctx.state === 'suspended') Audio.ctx.resume();
      (SFX[name] || SFX.click)(arg);
    } catch {}
  }

  /* ------------------------------- 语气声 -------------------------------- */
  // 用短促的双音提示替代 TTS：更稳定、更符合“轻声应了一句”的听感。
  const VOICE_PITCH = { man: 1.22, yan: 0.86, mom: 1.02, me: 1.0, null: 1.0 };

  function voice(person, opts = {}) {
    if (!Audio.ready || !Audio.enabled) return;
    const p = VOICE_PITCH[person] != null ? VOICE_PITCH[person] : 1.0;
    const at = now() + 0.002;
    try {
      tone(660 * p, at, 0.10, 0.024, 'sine', 0.35);
      tone(880 * p, at + 0.075, 0.13, 0.018, 'sine', 0.4);
    } catch {}
    if (Audio.tts && person && opts.text && global.speechSynthesis) {
      try {
        const u = new SpeechSynthesisUtterance(opts.text);
        u.lang = 'zh-CN';
        u.rate = 1.05;
        u.pitch = p;
        u.volume = 0.22;
        global.speechSynthesis.cancel();
        global.speechSynthesis.speak(u);
      } catch {}
    }
  }

  /* -------------------------------- 控制 --------------------------------- */

  function enable(on) {
    if (on) {
      if (!ensure()) return false;
      Audio.ctx.resume();
      Audio.enabled = true;
      Audio._startedAt = Date.now();
      Audio.master.gain.setTargetAtTime(Audio._vol.master, now(), 0.2);
      Audio._nextTime = now() + 0.1;
      Audio._step = 0;
      runTick();
      clearInterval(Audio._tick);
      Audio._tick = setInterval(runTick, 120);
      startAmbience();
      return true;
    }
    Audio.enabled = false;
    clearInterval(Audio._tick);
    Audio._tick = null;
    if (Audio.ctx) Audio.master.gain.setTargetAtTime(0.0001, now(), 0.12);
    killAmbience(0.5);
    try { global.speechSynthesis && global.speechSynthesis.cancel(); } catch {}
    return true;
  }

  function toggle() {
    return enable(!Audio.enabled);
  }

  function setMood(m) {
    if (!MOODS[m] || m === Audio._mood) return;
    Audio._mood = m;
    Audio._step = 0; // 新情绪从和声第一小节开始
  }

  function setScene(scene, weather) {
    const changed = Audio._scene !== scene || Audio._weather !== weather;
    Audio._scene = scene || Audio._scene;
    Audio._weather = weather || Audio._weather;
    if (!changed || !Audio.enabled) return;
    startAmbience();
  }

  function setVolume(bus, v) {
    Audio._vol[bus] = clamp(v, 0, 1);
    if (!Audio.ctx) return;
    if (bus === 'master') Audio.master.gain.setTargetAtTime(Audio.enabled ? Audio._vol.master : 0.0001, now(), 0.08);
    else if (Audio.bus[bus]) Audio.bus[bus].gain.setTargetAtTime(Audio._vol[bus], now(), 0.08);
  }

  // 统计真实播放时长（用于成就）
  setInterval(() => {
    if (Audio.enabled && Audio.ctx && Audio.ctx.state === 'running') Audio.played += 0.5;
  }, 500);

  Object.assign(Audio, {
    ensure, enable, toggle, setMood, setScene, setVolume, sfx, voice,
    MOODS, get enabledNow() { return Audio.enabled; },
  });
  SP.audio = Audio;
})(window);

</script>
<script data-part="stage.js">

    dpr: 1,
    w: 0,
    hgt: 0,
    scene: null,          // 初始为 null，保证首个场景一定会被构建

    weather: 'clear',
    transition: 'fade',
    parallax: { x: 0, y: 0, tx: 0, ty: 0 },

      { top: 22, left: 46, scale: 0.68, dur: 128, seed: 5, cls: 'c2' },
      { top: 7, left: 68, scale: 1.25, dur: 150, seed: 9, cls: 'c3' },
      { top: 31, left: 24, scale: 0.52, dur: 176, seed: 13, cls: 'c4' },
      { top: 17, left: 84, scale: 0.8, dur: 112, seed: 17, cls: 'c5' },

  /** 章节切换时的白场 */
  function wash(ms = 460) {
    const w = Stage.light.querySelector('.wash') || h('div.wash');

    setTimeout(() => w.classList.remove('active'), ms);
  }

   * 手动推进一帧（视差 + 粒子）。给截图工装和自动化测试用：
   * headless 环境合成帧极少，靠 rAF 跑不到天气效果，这里可以确定性地画。
   * @param {number} dt 秒
   */
  function renderFrame(dt = 0.016) {
    if (Stage.reduced) return;
    applyParallax();
    drawParticles(dt);
  }

  SP.stage = Object.assign(Stage, {
    init, setScene, setTime, setWeather, buildScene, wash, resize, renderFrame,
  });

/* 出边表。next 是函数的节点，用调用方给的 flag 样本逐个求值 ——
 * 分支图（ui.js）与剧情校验器都靠它把「函数式分岔」摊成明面上的边。 */
allEdges:(samples)=>{
  const ss=(samples&&samples.length)?samples:[{}];
  const out=[];
  for(const [id,n] of Object.entries(NODES)){
    if(typeof n.next==='string') out.push([id,n.next]);

      const seen=new Set();
      for(const f of ss){ let t=null; try{ t=n.next(f); }catch(e){ t=null; }

    }
    (n.choices||[]).forEach((c,i)=>out.push([id,c.to,c.label,i]));
  }
  return out;
}};

<script data-part="storage.js">
/*!
 * 晴天以后 · v2  |  storage.js
 * 持久化层：设置、3 个存档槽 + 自动存档、跨周目进度（结局图鉴 / 成就 / 已读节点）。
 */
(function (global) {
  'use strict';
  const SP = global.SP;
  const { Store } = SP;

  const K = {
    settings: 'sp4:settings',
    slots: 'sp4:slots',
    progress: 'sp4:progress',
    legacySave: 'after-sunshine-save-v2',
  };

  const DEFAULT_SETTINGS = {
    textSpeed: 2,        // 0 慢 1 稍慢 2 标准 3 快 4 瞬显
    autoSpeed: 1,        // 0 慢 1 标准 2 快
    fontSize: 1,         // 0 小 1 标准 2 大 3 特大
    volMaster: 0.8,
    volMusic: 0.62,
    volAmb: 0.5,
    volSfx: 0.6,
    typingSound: false,  // 打字音
    voiceCue: true,      // 语气提示音
    tts: false,          // 系统语音朗读
    reduceMotion: false,
    nightUI: false,      // 夜读界面
    showBonds: false,
    showProgress: true,
    autoSave: true,
    soundOn: false,      // 记住上次是否开着声音
    firstRun: true,
  };

  let settings = Object.assign({}, DEFAULT_SETTINGS, Store.get(K.settings, {}));
  let progress = Object.assign(
    { endings: [], achievements: [], readNodes: [], musicSeconds: 0, clears: 0, best: null },
    Store.get(K.progress, {})
  );
  let slots = Store.get(K.slots, { auto: null, 1: null, 2: null, 3: null });

  function saveSettings(patch) {
    if (patch) Object.assign(settings, patch);
    Store.set(K.settings, settings);
    return settings;
  }
  function getSettings() {
    return settings;
  }
  function resetSettings() {
    settings = Object.assign({}, DEFAULT_SETTINGS, { firstRun: false });
    Store.set(K.settings, settings);
    return settings;
  }

  function saveProgress() {
    Store.set(K.progress, progress);
    return progress;
  }
  function getProgress() {
    return progress;
  }

  /* ------------------------------- 存档槽 -------------------------------- */

  function listSlots() {
    const out = [];
    for (const id of ['auto', 1, 2, 3]) {
      const s = slots[id];
      out.push(
        s
          ? { id, empty: false, at: s.at, chapter: s.chapter, place: s.place, scene: s.scene, p: s.p, speaker: s.speaker, preview: s.preview, choices: s.choices, bonds: s.bonds }
          : { id, empty: true }
      );
    }
    return out;
  }

  function writeSlot(id, payload) {
    const s = JSON.parse(JSON.stringify(Object.assign({}, payload, { at: Date.now() })));
    slots[id] = s;
    Store.set(K.slots, slots);
    return s;
  }

  function readSlot(id) {
    const s = slots[id];
    if (!s || !s.state) return null;
    return JSON.parse(JSON.stringify(s));
  }

  function removeSlot(id) {
    slots[id] = null;
    Store.set(K.slots, slots);
  }

  /* ------------------------------- 跨周目 -------------------------------- */

  function unlockEnding(id) {
    if (!id || progress.endings.includes(id)) return false;
    progress.endings.push(id);
    progress.clears = (progress.clears || 0) + 1;
    saveProgress();
    return true;
  }

  function unlockAchievement(id) {
    if (progress.achievements.includes(id)) return false;
    progress.achievements.push(id);
    saveProgress();
    return true;
  }

  function markRead(nodeIds) {
    let added = 0;
    for (const id of [].concat(nodeIds)) {
      if (!progress.readNodes.includes(id)) {
        progress.readNodes.push(id);
        added++;
      }
    }
    if (added) saveProgress();
    return added;
  }

  function addMusicSeconds(sec) {
    progress.musicSeconds = (progress.musicSeconds || 0) + sec;
    if (progress.musicSeconds > 4) saveProgress();
  }

  /* ---------------------------- 导入 / 导出 ------------------------------ */

  function exportAll() {
    return JSON.stringify(
      { app: '晴天以后·留一盏灯（漫游版）', version: 4, exportedAt: new Date().toISOString(), slots, progress, settings },
      null,
      2
    );
  }

  function importAll(text) {
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      return { ok: false, msg: '文件不是合法的 JSON。' };
    }
    if (!data || typeof data !== 'object') return { ok: false, msg: '文件内容为空。' };
    if (data.version !== 4 && data.version !== 3) return { ok: false, msg: '请使用《留一盏灯》的存档文件，旧版剧情存档不能混用。' };
    let n = 0;
    if (data.slots && typeof data.slots === 'object') {
      for (const id of ['auto', 1, 2, 3]) {
        if (data.slots[id] && data.slots[id].state && SP.story.NODES[data.slots[id].state.id]) {
          slots[id] = data.slots[id];
          n++;
        }
      }
      Store.set(K.slots, slots);
    }
    if (Array.isArray(data.progress?.endings)) {
      progress.endings = Array.from(new Set([].concat(progress.endings, data.progress.endings)));
      progress.achievements = Array.from(new Set([].concat(progress.achievements, data.progress.achievements || [])));
      progress.readNodes = Array.from(new Set([].concat(progress.readNodes, data.progress.readNodes || [])));
      progress.musicSeconds = Math.max(progress.musicSeconds || 0, data.progress.musicSeconds || 0);
      saveProgress();
    }
    if (data.settings && typeof data.settings === 'object') {
      settings = Object.assign(settings, data.settings, { firstRun: false });
      saveSettings();
    }
    return { ok: true, msg: `已导入 ${n} 个存档，并合并了收集进度。` };
  }

  function wipeAll() {
    Store.del(K.settings);
    Store.del(K.slots);
    Store.del(K.progress);
    settings = Object.assign({}, DEFAULT_SETTINGS);
    progress = { endings: [], achievements: [], readNodes: [], musicSeconds: 0, clears: 0, best: null };
    slots = { auto: null, 1: null, 2: null, 3: null };
  }

  /** 尝试把原版（v1）的存档迁移过来，作为一份可读取的自动存档 */
  function migrateLegacy() {
    if (progress.migrated) return false;
    const legacy = Store.get(K.legacySave, null);
    progress.migrated = true;
    if (!legacy || !legacy.id) {
      saveProgress();
      return false;
    }
    if (slots.auto) {
      saveProgress();
      return false;
    }
    slots.auto = {
      at: Date.now(),
      state: {
        id: legacy.id,
        flags: legacy.flags || {},
        bonds: { man: 0, yan: 0, family: 0, self: 0 },
        history: [],
        log: legacy.log || [],
        choices: 0,
        startedAt: Date.now(),
        playedMs: 0,
      },
      chapter: '', place: '', scene: '', p: 0, preview: '（来自旧版存档）', legacy: true,
    };
    Store.set(K.slots, slots);
    saveProgress();
    return true;
  }

  SP.storage = {
    K, DEFAULT_SETTINGS,
    getSettings, saveSettings, resetSettings,
    getProgress, saveProgress,
    listSlots, writeSlot, readSlot, removeSlot,
    unlockEnding, unlockAchievement, markRead, addMusicSeconds,
    exportAll, importAll, wipeAll, migrateLegacy,
  };
})(window);


</script>
